        Object.assign(S, { on: true, mode: "drag", ox: x, oy: y, tx: x, ty: y, broken: false });
        C.forEach(c => Object.assign(c, { x, y, vx: 0, vy: 0, r: c.r * 0.5 }));
        L.style.visibility = "visible";
      },
      move(x, y, dx, dy) {
        setPrimary(drag.hue + dx / innerWidth, drag.sat - dy / (innerHeight * 0.5));
        S.tx = x; S.ty = y;
        if (!S.broken && Math.hypot(x - S.ox, y - S.oy) > 300) { S.broken = true; C[NC - 1].rv += 120; }
      },
      up(x, y, click) {
        if (click) {
          freshColor();
          Object.assign(S, { on: true, mode: "plop", ox: x, oy: y, t: 0 });
          C.forEach((c, i) => Object.assign(c, { x, y, vx: 0, vy: 0, r: 0, rv: i < 3 ? 60 : 0 }));
          L.style.visibility = "visible";
          S.timer = setTimeout(() => { const cols = [0, 1, 2].map(rgbCss); C.slice(0, 3).forEach((c, i) => pop(c.x, c.y, [cols[i], cols[i], cols[(i + 1) % 3]])); S.mode = "off"; }, 700);
        } else {
          S.mode = "return"; S.tx = S.ox; S.ty = S.oy;           // the tip whips back in…
          S.timer = setTimeout(() => { pop(S.ox, S.oy); S.mode = "off"; }, 230);   // …merges, and bursts
        }
      },
      tick(dt) {
        if (L.style.visibility === "hidden") return;
        S.t += dt;
        const cols = [0, 1, 2].map(rgbCss);
        const d = Math.hypot(S.tx - S.ox, S.ty - S.oy), stretch = Math.min(1, d / 300);
        C.forEach((c, i) => {
          let tx, ty, tr;
          if (S.mode === "plop") {
            const a = (i / 3) * Math.PI * 2 - Math.PI / 2, sep = Math.max(0, S.t - 0.25) * 130;
            tx = S.ox + (i < 3 ? Math.cos(a) * sep : 0); ty = S.oy + (i < 3 ? Math.sin(a) * sep : 0);
            tr = i < 3 ? 34 : 0;
            c.el.setAttribute("fill", cols[i % 3]);
          } else {
            const t = i / (NC - 1);
            tx = S.ox + (S.tx - S.ox) * t; ty = S.oy + (S.ty - S.oy) * t;
            const neck = S.broken && t > 0.1 && t < 0.9 ? 0 : 1 - 0.78 * Math.sin(Math.PI * t) * stretch;
            tr = S.mode === "off" ? 0 : (32 + (22 - 32) * t) * neck;
            if (S.broken && t <= 0.1) tr = 22; if (S.broken && t >= 0.9) tr = 28;
            c.el.setAttribute("fill", primCss());
          }
          const k = 240 - i * 14;                              // later beads lag: the goo wobbles
          [c.x, c.vx] = spring(c.x, c.vx, tx, k, 13, dt);
          [c.y, c.vy] = spring(c.y, c.vy, ty, k, 13, dt);
          [c.r, c.rv] = spring(c.r, c.rv, tr, 300, 12, dt);
          c.el.setAttribute("cx", c.x.toFixed(1)); c.el.setAttribute("cy", c.y.toFixed(1)); c.el.setAttribute("r", Math.max(0, c.r).toFixed(1));
        });
        if (S.mode === "off" && C.every(c => c.r < 0.5)) L.style.visibility = "hidden";
      },
      cancel() { S.mode = "off"; },
    };
  })(),

  // 11 · big numerals (hue on top, saturation below) trail the pointer on springs and scramble as they change;
  //      everything crumbles into dust
  type: (() => {
    let lines = [], mode = "off", born = 0, crumbleAt = 0;
    const FONT = 600, SIZE = 104;
    // palette colours for the scheme label, with the light one pulled down so it never vanishes into the paper
    // cap perceived brightness so yellows and pastels stay readable on paper
    const readable = ([r, g, b], cap = 0.4) => {
      const Y = 0.2126 * r + 0.7152 * g + 0.0722 * b, k = Y > cap ? cap / Y : 1;
      return `rgb(${Math.round(r * k * 255)},${Math.round(g * k * 255)},${Math.round(b * k * 255)})`;
    };
    const labelColor = i => readable([palOut[i * 3], palOut[i * 3 + 1], palOut[i * 3 + 2]]);
    const setLine = (li, str, x, y, { size = SIZE, stagger = 0, caption = "", color = null } = {}) => {
      const L = lines[li] || (lines[li] = { chars: [] });
      Object.assign(L, { x, y, size, caption, color });
      [...str].forEach((ch, i) => {
        let c = L.chars[i];
        if (!c) c = L.chars[i] = { ch, x, y, vx: 0, vy: 0, s: 0, sv: 0, scr: 0, delay: i * stagger + li * 0.05, col: null };
        if (c.ch !== ch) { c.ch = ch; c.scr = 0.16; }
      });
      L.chars.length = str.length;
    };
    const readout = (x, y) => {
      const flip = x + 26 + SIZE * 0.6 * 4 > innerWidth, lx = flip ? x - 26 - SIZE * 0.6 * 4 : x + 26;
      // hue: always shown at a healthy saturation, so it only tells you "which colour"
      setLine(0, `${hueDeg()}°`, lx, y - SIZE * 1.9 - 8, { caption: "hue", color: readable(hslToRgb([primHue, 0.85, 0.48])) });
      // sat: the colour as it will really come out, greying all the way down at 0%
      setLine(1, `${Math.round(primSat * 100)}%`, lx, y - SIZE * 0.95 - 8, { caption: "sat", color: readable(hslToRgb([primHue, primSat, 0.45])) });
    };
    const crumble = () => {
      for (const L of lines) for (const c of L.chars) {
        const cw = L.size * 0.6, off = document.createElement("canvas");
        off.width = Math.ceil(cw + 8); off.height = Math.ceil(L.size + 8);
        const o = off.getContext("2d", { willReadFrequently: true });
        o.font = `${FONT} ${L.size}px "JetBrains Mono", monospace`; o.textBaseline = "top"; o.fillText(c.ch, 4, 4);
        const d = o.getImageData(0, 0, off.width, off.height).data, step = L.size > 70 ? 5 : 4;
        for (let y = 0; y < off.height; y += step) for (let x = 0; x < off.width; x += step) {
          if (d[(y * off.width + x) * 4 + 3] < 128) continue;
          emit({ x: c.x + x - 4, y: c.y + y - 4, s: step, c: c.col || L.color || primCss(), vx: rnd(-60, 60), vy: rnd(-160, 0),
            g: rnd(700, 1100), hold: rnd(0, 0.12) + (c.x - lines[0].x) * 0.0005, life: 1.5 });
        }
      }
      lines = []; mode = "off"; veil.on = false;
    };
    return {
      label: "Type",
      down(x, y) { lines = []; mode = "drag"; readout(x, y); },
      move(x, y, dx, dy) { setPrimary(drag.hue + dx / innerWidth, drag.sat - dy / (innerHeight * 0.5)); readout(x, y); },
      up(x, y, click) {
        if (!click) return crumble();
        freshColor();
        lines = []; mode = "label"; born = performance.now(); veil.on = true;
        const name = SCHEMES[schemeIdx].name.toLowerCase();
        const size = Math.min(SIZE, (innerWidth * 0.86) / (name.length * 0.6));      // long names shrink to fit
        const w = name.length * size * 0.6, lx = Math.max(12, Math.min(innerWidth - w - 12, x - w / 2));
        setLine(0, name, lx, y - size - 16, { size, stagger: 0.035 });
        lines[0].chars.forEach((c, i) => (c.col = labelColor(i % 3)));
        crumbleAt = born + 1100 + name.length * 35;
      },
      tick(dt) {
        if (mode === "off" || !lines.length) return;
        if (mode === "label" && performance.now() > crumbleAt) return crumble();
        fxDirty = true;
        const age = (performance.now() - born) / 1000;
        lines.forEach((L, li) => {
          const cw = L.size * 0.6;
          fxc.font = `${FONT} ${L.size}px "JetBrains Mono", monospace`; fxc.textBaseline = "top";
          L.chars.forEach((c, i) => {
            const live = mode !== "label" || age > c.delay;
            const k = Math.max(50, 260 - (i + li * 1.5) * 30);         // each glyph lags a bit more; the second line trails the first
            [c.x, c.vx] = spring(c.x, c.vx, L.x + i * cw, k, 14, dt);
            [c.y, c.vy] = spring(c.y, c.vy, L.y, k, 14, dt);
            [c.s, c.sv] = spring(c.s, c.sv, live ? 1 : 0, 360, 13, dt);
            c.scr = Math.max(0, c.scr - dt);
            let ch = c.ch;
            if (c.scr > 0 && /[0-9]/.test(ch)) ch = String(Math.floor(Math.random() * 10));
            const sc = Math.max(0, c.s);
            if (sc < 0.02) return;
            fxc.save(); fxc.translate(c.x + cw / 2, c.y + L.size / 2); fxc.rotate(Math.max(-0.3, Math.min(0.3, c.vx * 0.0008))); fxc.scale(sc, sc);
            fxc.fillStyle = c.col || L.color || primCss(); fxc.fillText(ch, -cw / 2, -L.size / 2); fxc.restore();
          });
          if (L.caption && L.chars[0]) {                           // tiny caption tucked above each number
            fxc.font = `400 12px "JetBrains Mono", monospace`; fxc.textBaseline = "bottom"; fxc.fillStyle = "rgba(0,0,0,.45)";
            fxc.fillText(L.caption, L.chars[0].x + 4, L.chars[0].y + 14);
          }
        });
      },
      cancel() { if (lines.length) crumble(); },
    };
  })(),

  // 12 · a vortex of palette pixels spirals into the press point; circle around it to spin the hue
  vortex: (() => {
    const P = [];
    const S = { on: false, cx: 0, cy: 0, spin: 1, last: null, core: 0, cv: 0, held: 0, implode: 0, flash: [] };
    const spawn = p => Object.assign(p, { th: rnd(0, 6.28), r: rnd(200, 540), c: palColor(), s: rnd(4, 9) });
    const explode = (x, y, parts) => {
      parts.forEach(p => { const a = p.th + rnd(-0.3, 0.3), v = rnd(260, 620);
        emit({ x: x + Math.cos(p.th) * p.r, y: y + Math.sin(p.th) * p.r, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 140, s: p.s + 1, c: p.c, g: 900, life: 1.5 }); });
      S.flash.push({ x, y, t: 0 });
    };
    return {
      label: "Vortex",
      down(x, y) {
        Object.assign(S, { on: true, cx: x, cy: y, spin: 1, last: null, core: 0, cv: 0, held: 0, implode: 0 });
        P.length = 0; for (let i = 0; i < 200; i++) P.push(spawn({}));
      },
      move(x, y) {
        const dx = x - S.cx, dy = y - S.cy, r = Math.hypot(dx, dy);
        if (r < 12) return;
        const a = Math.atan2(dy, dx);
        if (S.last !== null) { let da = a - S.last; da -= Math.round(da / (Math.PI * 2)) * Math.PI * 2; primHue += da / (Math.PI * 2); S.spin += da * 8; }
        S.last = a;
        primSat = clamp01((r - 20) / 160);
        updatePalette();
      },
      up(x, y, click) {
        if (click) {
          freshColor();
          const burst = Array.from({ length: 120 }, () => ({ th: rnd(0, 6.28), r: rnd(0, 8), c: palColor(), s: rnd(5, 10) }));
          explode(x, y, burst);
          S.on = false;
        } else { S.implode = 0.16; }                              // suck everything in, then blow it apart
      },
      tick(dt) {
        if (S.flash.length) {
          fxDirty = true;
          S.flash = S.flash.filter(f => (f.t += dt) < 0.45);
          S.flash.forEach(f => { const k = f.t / 0.45; fxc.strokeStyle = `rgba(255,255,255,${1 - k})`; fxc.lineWidth = 6 * (1 - k) + 1;
            fxc.beginPath(); fxc.arc(f.x, f.y, 10 + k * 180, 0, 7); fxc.stroke();
            fxc.strokeStyle = primCss(); fxc.globalAlpha = 1 - k; fxc.lineWidth = 2; fxc.beginPath(); fxc.arc(f.x, f.y, 6 + k * 150, 0, 7); fxc.stroke(); fxc.globalAlpha = 1; });
        }
        if (!S.on) return;
        fxDirty = true;
        S.held += dt;
        S.spin += (Math.sign(S.spin || 1) * 1 - S.spin) * 1.2 * dt;
        [S.core, S.cv] = spring(S.core, S.cv, Math.min(34, 8 + S.held * 7), 200, 14, dt);
        if (S.implode > 0) {
          S.implode -= dt;
          P.forEach(p => (p.r = Math.max(2, p.r - 2400 * dt)));
          if (S.implode <= 0) { explode(S.cx, S.cy, P); P.length = 0; S.on = false; return; }
        } else {
          P.forEach(p => {
            p.th += S.spin * (2.2 * 90 / (p.r + 40)) * dt;
            p.r -= (50 + 5200 / (p.r + 30)) * dt;
            if (p.r < S.core) { spawn(p); p.c = palColor(); }
          });
        }
        P.forEach(p => { fxc.fillStyle = p.c; const w = p.s * Math.min(1, p.r / 60 + 0.3);
          fxc.fillRect(Math.round(S.cx + Math.cos(p.th) * p.r - w / 2), Math.round(S.cy + Math.sin(p.th) * p.r - w / 2), Math.ceil(w), Math.ceil(w)); });
        // the core: a dithered disc of the palette
        const R = S.core;
        for (let y = -R; y <= R; y += 3) for (let x = -R; x <= R; x += 3) {
          const d = Math.hypot(x, y) / R; if (d > 1) continue;
          fxc.fillStyle = rgbCss(Math.max(0, Math.min(2, Math.floor(d * 2 + b4(x / 3, y / 3)))));
          fxc.fillRect(Math.round(S.cx + x), Math.round(S.cy + y), 3, 3);
        }
      },
      cancel() { if (S.on) this.up(S.cx, S.cy, false); },
    };
  })(),
});

// 13 · ruler guides: a hue ruler slides in along the bottom edge and a saturation ruler along the left;
//      the markers read the value right under your pointer
Object.assign(IX, {
  rulers: (() => {
    const L = layer(`<canvas class="rl-bottom"></canvas><canvas class="rl-left"></canvas>`);
    L.style.visibility = "visible";
    const cb = L.querySelector(".rl-bottom"), cl = L.querySelector(".rl-left");
    const bx = cb.getContext("2d"), lx = cl.getContext("2d");
    const HB = 40, WL = 48;
    const S = { vis: false, drag: false, x0: 0, y0: 0, h0: 0, s0: 0, mx: 0, my: 0, mvx: 0, mvy: 0, tx: 0, ty: 0,
                pulse: 0, pv: 0, name: "", anims: [], timer: 0, lastDetent: null };
    const hueAt = x => S.h0 + (x - S.x0) / innerWidth;
    const satAt = y => S.s0 - (y - S.y0) / (innerHeight * 0.5);
    const yForSat = v => S.y0 - (v - S.s0) * innerHeight * 0.5;
    const size = () => {
      cb.width = innerWidth * dpr; cb.height = HB * dpr;
      cl.width = WL * dpr; cl.height = innerHeight * dpr;
    };
    addEventListener("resize", size); size();
    const show = (x, y) => {
      clearTimeout(S.timer); S.anims.forEach(a => a.cancel()); S.anims = [];
      Object.assign(S, { vis: true, x0: x, y0: y, h0: primHue, s0: primSat, mx: x, my: y, mvx: 0, mvy: 0, tx: x, ty: y, name: "", lastDetent: null });
      cb.style.display = cl.style.display = "block";
      const W = innerWidth, H = innerHeight, e = "cubic-bezier(.2,.9,.3,1)";
      // each ruler draws itself outward from where your pointer lines up with it, then settles with a little bounce
      S.anims.push(cb.animate([
        { transform: `translateY(${HB}px)`, clipPath: `inset(0 ${W - x}px 0 ${x}px)` },
        { transform: "translateY(-4px)", clipPath: "inset(0 0 0 0)", offset: .7 },
        { transform: "translateY(0)", clipPath: "inset(0 0 0 0)" }], { duration: 440, easing: e, fill: "both" }));
      S.anims.push(cl.animate([
        { transform: `translateX(${-WL}px)`, clipPath: `inset(${y}px 0 ${H - y}px 0)` },
        { transform: "translateX(4px)", clipPath: "inset(0 0 0 0)", offset: .7 },
        { transform: "translateX(0)", clipPath: "inset(0 0 0 0)" }], { duration: 440, delay: 60, easing: e, fill: "both" }));
    };
    const hide = () => {
      S.drag = false;
      S.anims.push(cb.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: `translateY(${HB}px)`, opacity: 0 }],
        { duration: 240, easing: "cubic-bezier(.7,0,.84,0)", fill: "forwards" }));
      S.anims.push(cl.animate([{ transform: "translateX(0)", opacity: 1 }, { transform: `translateX(${-WL}px)`, opacity: 0 }],
        { duration: 240, delay: 40, easing: "cubic-bezier(.7,0,.84,0)", fill: "forwards" }));
      S.timer = setTimeout(() => { S.vis = false; cb.style.display = cl.style.display = "none"; }, 320);
    };
    const drawBottom = () => {
      const W = innerWidth, c = bx;
      c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, HB);
      c.fillStyle = "rgba(250,249,245,.95)"; c.fillRect(0, 0, W, HB);
      c.fillStyle = "rgba(0,0,0,.12)"; c.fillRect(0, 0, W, 1);
      for (let x = 0; x < W; x += 2) { c.fillStyle = `hsl(${hueAt(x) * 360} 85% 55%)`; c.fillRect(x, 1, 2, 5); }   // the spectrum strip
      const d0 = Math.floor(hueAt(0) * 72) * 5, d1 = Math.ceil(hueAt(W) * 72) * 5;
      c.font = `400 9px "JetBrains Mono", monospace`; c.textBaseline = "top";
      for (let d = d0; d <= d1; d += 5) {                         // notches: every 5°, bigger every 15°, labelled every 30°
        const x = Math.round(S.x0 + (d / 360 - S.h0) * W) + 0.5, big = d % 30 === 0, mid = d % 15 === 0;
        c.fillStyle = big ? "rgba(0,0,0,.55)" : "rgba(0,0,0,.28)";
        c.fillRect(x - 0.5, 6, 1, big ? 13 : mid ? 9 : 5);
        if (big) { c.fillStyle = "rgba(0,0,0,.45)"; c.fillText(`${((d % 360) + 360) % 360}°`, x + 3, 22); }
      }
      // marker: a notch that tracks the pointer, with the live value
      const mx = Math.round(S.mx), sc = 1 + S.pulse;
      c.fillStyle = "#111"; c.fillRect(mx - 1, 0, 2, HB);
      c.beginPath(); c.moveTo(mx - 6 * sc, 0); c.lineTo(mx + 6 * sc, 0); c.lineTo(mx, 8 * sc); c.fill();
      const label = S.name || `${hueDeg()}°`;
      c.font = `600 11px "JetBrains Mono", monospace`;
      const tw = c.measureText(label).width, lxp = mx + 8 + tw + 10 > W ? mx - 8 - tw - 10 : mx + 8;
      c.fillStyle = "#111"; c.fillRect(lxp, 19, tw + 10, 16);
      c.fillStyle = primCss(); c.fillRect(lxp, 19, 3, 16);
      c.fillStyle = "#fff"; c.fillText(label, lxp + 6, 22);
    };
    const drawLeft = () => {
      const H = innerHeight, c = lx;
      c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, WL, H);
      c.fillStyle = "rgba(250,249,245,.95)"; c.fillRect(0, 0, WL, H);
      c.fillStyle = "rgba(0,0,0,.12)"; c.fillRect(WL - 1, 0, 1, H);
      const hd = hueDeg();
      for (let y = 0; y < H; y += 2) {                            // the saturation strip; hatched past 0% / 100%
        const v = satAt(y);
        if (v < 0 || v > 1) { c.fillStyle = (Math.floor(y / 4) % 2) ? "rgba(0,0,0,.08)" : "rgba(0,0,0,.02)"; c.fillRect(WL - 6, y, 5, 2); continue; }
        c.fillStyle = `hsl(${hd} ${v * 100}% 50%)`; c.fillRect(WL - 6, y, 5, 2);
      }
      c.font = `400 9px "JetBrains Mono", monospace`; c.textBaseline = "middle"; c.textAlign = "right";
      for (let pct = 0; pct <= 100; pct += 5) {
        const y = Math.round(yForSat(pct / 100)) + 0.5, big = pct % 25 === 0;
        if (y < -2 || y > H + 2) continue;
        c.fillStyle = big ? "rgba(0,0,0,.55)" : "rgba(0,0,0,.28)";
        c.fillRect(WL - 7 - (big ? 12 : 6), y - 0.5, big ? 12 : 6, 1);
        if (big) { c.fillStyle = "rgba(0,0,0,.45)"; c.fillText(`${pct}%`, WL - 22, y); }
      }
      c.textAlign = "left";
      const my = Math.round(S.my);
      c.fillStyle = "#111"; c.fillRect(0, my - 1, WL, 2);
      c.beginPath(); c.moveTo(WL, my - 6); c.lineTo(WL, my + 6); c.lineTo(WL - 8, my); c.fill();
      const label = `${Math.round(primSat * 100)}%`;
      c.font = `600 11px "JetBrains Mono", monospace`;
      c.fillStyle = "#111"; c.fillRect(2, my + 4, c.measureText(label).width + 8, 16);
      c.fillStyle = "#fff"; c.textBaseline = "top"; c.fillText(label, 6, my + 7);
    };
    return {
      label: "Rulers",
      down(x, y) { show(x, y); S.drag = true; },
      move(x, y) {
        let deg = hueAt(x) * 360;
        const near = Math.round(deg / 15) * 15;
        if (Math.abs(deg - near) < 2.2) {                         // magnetic notch every 15°
          deg = near;
          if (S.lastDetent !== near) { S.lastDetent = near; S.pv += 9; }
        } else S.lastDetent = null;
        setPrimary(deg / 360, satAt(y));
        S.tx = S.x0 + (deg / 360 - S.h0) * innerWidth;
        S.ty = Math.max(yForSat(1), Math.min(yForSat(0), y));
      },
      up(x, y, click) {
        if (!click) return hide();
        show(x, y); S.drag = false;
        freshColor();
        let dh = wrap1(primHue) - wrap1(S.h0); dh -= Math.round(dh);    // glide the shorter way round
        S.tx = S.x0 + dh * innerWidth; S.ty = yForSat(primSat);
        S.h0 = primHue - dh;                                       // keep the ruler's scale continuous across the wrap
        S.name = SCHEMES[schemeIdx].name.toLowerCase();
        S.timer = setTimeout(hide, 1100);
      },
      tick(dt) {
        if (!S.vis) return;
        [S.mx, S.mvx] = spring(S.mx, S.mvx, S.tx, 260, 18, dt);
        [S.my, S.mvy] = spring(S.my, S.mvy, S.ty, 260, 18, dt);
        [S.pulse, S.pv] = spring(S.pulse, S.pv, 0, 400, 14, dt);
        drawBottom(); drawLeft();
        if (S.drag) {                                              // dashed guides from the pointer to both rulers
          fxDirty = true;
          fxc.save(); fxc.setLineDash([3, 4]); fxc.strokeStyle = "rgba(0,0,0,.3)"; fxc.lineWidth = 1;
          fxc.beginPath(); fxc.moveTo(S.mx, S.my); fxc.lineTo(S.mx, innerHeight - HB);
          fxc.moveTo(S.mx, S.my); fxc.lineTo(WL, S.my); fxc.stroke(); fxc.restore();

    else if (cmd === "L") { cx = num(); cy = num(); cur.segs.push({ t: "L", p: [cx, cy] }); }
    else if (cmd === "H") { cx = num(); cur.segs.push({ t: "L", p: [cx, cy] }); }

// ---------- landing: shedding — moving over the ink knocks loose a few pixels of the hidden colour ----------
const ptr = { x: -999, y: -999, vx: 0, vy: 0, on: false, t: 0 };

  if (!inkAt(ptr.x, ptr.y)) return;
  shedAcc += dist;

    emit({ x, y, vx: ptr.vx * 0.25 + rnd(-40, 40), vy: rnd(-140, -30), s: rnd(4, 6.5), c: palColor(), g: 900, life: 1.2 });

// ---------- landing intros (switchable) ----------

const INTRO_PLANS = {
  // 1 · the original: colour bursts, then colour blocks cooling to black
  1: env => {

        kind: kind < 0.45 ? "pix" : kind < 0.8 ? "leak" : "solid", on: Array.from({ length: 12 }, () => Math.random() < 0.72), start: Math.floor(Math.random() * 5) };
      if (s.kind === "pix") s.img = pixStar(8 + Math.floor(Math.random() * 5), P[(Math.random() * 3) | 0], P[(Math.random() * 3) | 0]);
      s.c = Pc[(Math.random() * 3) | 0];

    });

        ctx.fillStyle = "rgba(0,0,0,.35)";
        for (let x = 0; x < W; x += 12 * D) ctx.fillRect(Math.round(x), by + 6 * D, D, (Math.round(x / (12 * D)) % 5 === 0 ? 12 : 5) * D);
        for (let y = 0; y < H; y += 12 * D) ctx.fillRect(lxp + RL - 7 * D - (Math.round(y / (12 * D)) % 5 === 0 ? 12 : 6) * D, Math.round(y), (Math.round(y / (12 * D)) % 5 === 0 ? 12 : 6) * D, D);
        if (s > 0 && t < SNAP) {                                // the hue marker rides the scan line
          const mx = Math.round(scanX), lbl = `${Math.round(hueAt(scanX))}°`;
          ctx.fillStyle = "#111"; ctx.fillRect(mx - D, by, 2 * D, RB);
          ctx.font = `600 ${11 * D}px "JetBrains Mono", monospace`; ctx.textBaseline = "top";
          const tw = ctx.measureText(lbl).width;
          ctx.fillRect(mx + 8 * D, by + 19 * D, tw + 10 * D, 16 * D); ctx.fillStyle = "#fff"; ctx.fillText(lbl, mx + 13 * D, by + 22 * D);
        }
      }
    }};
  },
};

function playIntro(kind) {
  landingSkip?.();
  document.querySelectorAll(".landing-intro").forEach(el => el.remove());
  introDone = false;
  const ov = document.createElement("canvas");
  ov.className = "landing-intro";
  ov.width = canvas.width; ov.height = canvas.height;
  document.body.appendChild(ov);
  const ctx = ov.getContext("2d");
  const W = ov.width, H = ov.height, sc = rect[2] / FW;
  const env = { ctx, W, H, vw: RW * sc, vh: RH * sc, vx: rect[0] + PAD * sc, vy: H - (rect[1] + rect[3]) + PAD * sc, dpr };
  const plan = INTRO_PLANS[kind](env);
  const t0 = performance.now();
  let finished = false;
  const finish = (instant = false) => {
    if (finished) return;
    finished = true; introDone = true;
    if (instant) ov.remove();
    else ov.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, fill: "forwards" }).finished.then(() => ov.remove());
  };
  landingSkip = () => finish(true);            // clicking during the intro jumps straight to the end
  (function draw(now) {
    if (finished) return;
    const t = now - t0;
    plan.draw(Math.min(t, plan.dur));
    if (t < plan.dur) return requestAnimationFrame(draw);
    finish();                                   // hand over to the live WebGL page underneath
  })(t0);
}

// ---------- landing ----------
function landingSetup() {
  document.title = "Top Young Design Talent";
  setMode(effects.indexOf("dither"));
  bloomLock = true;
  Object.assign(bloomU, [-1e6, -1e6, 0, 22 * dpr]);          // no bloom yet: everything reads as the plain vector
  // the real page: one fixed interaction (Type + Rulers, pixel + gray backdrop) and no visible controls or hints.
  // set directly rather than through the pickers, so the lab's saved choices are left alone
  IX[ixName].cancel?.();
  ixName = "typerulers";
  veil.mode = "pixel";

  // the wake-up: a hard switch to Bayer Dither (the same click then carries on as a normal click)
  landingWake = () => {
    dormant = false; bloomLock = false; palOld.set(palOut); bloomU[3] = 0;
  };

  playIntro(INTRO);
}

buildField().then(() => {
  if (LANDING) landingSetup();
  else if (SPRAY_PAGE) { document.title = "Top Young Design Talent"; setMode(effects.indexOf("spray")); }
  else if (FLASH_PAGE) {
    document.title = "Top Young Design Talent";
    const fin = new URLSearchParams(location.search).get("finish");            // otherwise: whatever the Lab's switch was left on
    FX.flashbulb.toggles.finish.value = fin === "spray" ? 0 : 1;             // puff unless asked for spray (and never drips here)
    setMode(effects.indexOf("flashbulb"));
  }
  else setMode(Math.max(0, effects.indexOf(new URLSearchParams(location.search).get("fx"))));   // ?fx=sundial etc.
  requestAnimationFrame(frame);
  // warm the remaining shaders in the background so switching doesn't hitch
  let i = 0;
  const warm = () => { if (i < effects.length) { fxProgram(effects[i++]); setTimeout(warm, 30); } };
  setTimeout(warm, 400);
}).catch(err => {
  document.getElementById("fallback").textContent = "Couldn't load vector.svg — serve this folder over http.";
  document.getElementById("fallback").style.display = "grid";
  console.error(err);
});
</script>
