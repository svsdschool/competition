<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hover Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #ffffff;
    --ink: #111;
    --pill: rgba(255,255,255,0.72);
    --pill-border: rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden; }
  body { font-family: "JetBrains Mono", ui-monospace, monospace; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; touch-action: none; }

  header {
    position: fixed; top: 20px; left: 24px; right: 24px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    pointer-events: none; font-size: 12px; letter-spacing: 0.02em;
  }
  .fx-group { opacity: .5; text-transform: uppercase; letter-spacing: .08em; }
  .fx-name { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin-top: 6px; }
  .fx-desc { opacity: .6; margin-top: 4px; max-width: 38ch; line-height: 1.5; }
  .fx-status { margin-top: 8px; display: flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
  .fx-status[hidden] { display: none; }
  .fx-status i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .hint { opacity: .55; text-align: right; line-height: 1.7; }
  .xlink { color: inherit; pointer-events: auto; }
  kbd { font: inherit; padding: 1px 5px; border: 1px solid currentColor; border-radius: 4px; }

  /* effect picker: ‹ current effect › pill; the list opens upward */
  nav {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 2px; padding: 5px; border-radius: 999px; align-items: center;
    background: var(--pill); border: 1px solid var(--pill-border);
    backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: 0 10px 30px -12px rgba(0,0,0,0.25);
  }
  nav button {
    font: inherit; font-size: 12px; border: 0; background: transparent; color: var(--ink);
    padding: 8px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 8px;
    transition: background .15s, color .15s;
  }
  nav button:hover { background: rgba(0,0,0,0.06); }
  nav .step { width: 32px; height: 32px; padding: 0; justify-content: center; font-size: 15px; }
  nav .pick { min-width: 220px; justify-content: space-between; background: var(--ink); color: #fff; padding: 8px 12px 8px 14px; }
  nav .pick:hover { background: var(--ink); }
  nav .pick .grp { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; opacity: .55; }
  nav .pick .name { font-weight: 600; margin-right: auto; }
  nav .pick svg { width: 10px; height: 10px; transition: transform .35s cubic-bezier(.3,1.5,.5,1); }
  nav .pick[aria-expanded="true"] svg { transform: rotate(180deg); }

  .fx-menu {
    position: fixed; left: 50%; bottom: 74px; z-index: 11; width: 280px; max-height: calc(100vh - 110px); overflow-y: auto;
    padding: 6px; border-radius: 16px; background: rgba(255,255,255,.9); border: 1px solid var(--pill-border);
    backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.35), 0 2px 8px -2px rgba(0,0,0,.08);
    transform-origin: 50% 100%; transform: translateX(-50%) translateY(10px) scale(.92); opacity: 0; visibility: hidden;
    transition: transform .42s cubic-bezier(.3,1.45,.5,1), opacity .18s, visibility 0s .42s;
    scrollbar-width: none;
  }
  .fx-menu.open { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; visibility: visible; transition: transform .42s cubic-bezier(.3,1.45,.5,1), opacity .18s, visibility 0s; }
  .fx-menu .grp { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; opacity: .4; padding: 10px 10px 4px; }
  .fx-menu .grp:first-child { padding-top: 4px; }
  .fx-menu button {
    width: 100%; display: flex; align-items: center; gap: 10px; font: inherit; font-size: 12.5px; text-align: left;
    padding: 8px 10px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); cursor: pointer;
    transition: background .12s;
  }
  .fx-menu button .num { font-size: 10px; opacity: .35; font-variant-numeric: tabular-nums; }
  .fx-menu button .tick { margin-left: auto; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .35s cubic-bezier(.3,1.6,.5,1); }
  .fx-menu button:hover, .fx-menu button:focus-visible { background: rgba(0,0,0,.06); outline: none; }
  .fx-menu button[aria-selected="true"] { font-weight: 600; }
  .fx-menu button[aria-selected="true"] .tick { opacity: 1; transform: none; }
  /* items slide in one after another as the list opens */
  .fx-menu button, .fx-menu .grp { opacity: 0; transform: translateY(6px); transition: background .12s, opacity .2s, transform .35s cubic-bezier(.3,1.5,.5,1); }
  .fx-menu.open button, .fx-menu.open .grp { opacity: 1; transform: none; transition-delay: calc(var(--i) * 18ms); }
  .fx-menu.open .grp { opacity: .4; }
  .fx-menu.open button:hover { transition-delay: 0s; }

  /* Bayer Dither drag indicator — kept quiet on purpose */
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; visibility: hidden; }
  .hud-lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .hud-lines line { stroke: var(--ink); stroke-width: 1; opacity: .18; }
  .hud-origin { position: absolute; left: 0; top: 0; will-change: transform; }
  .hud-origin i {
    position: absolute; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%;
    background: var(--ink); opacity: .55;
  }
  /* hairline arms hint the axes: hue sideways, saturation up/down */
  .hud-origin .arm-h, .hud-origin .arm-v { position: absolute; border-radius: 1px; opacity: .55; }
  .hud-origin .arm-h {
    width: 44px; height: 1.5px; margin: -0.75px 0 0 -22px;
    background: linear-gradient(90deg, transparent, hsl(0 90% 55%) 15%, hsl(120 90% 45%) 50%, hsl(240 90% 60%) 85%, transparent);
  }
  .hud-origin .arm-v { width: 1.5px; height: 44px; margin: -22px 0 0 -0.75px; }
  .hud-chip {
    position: absolute; left: 0; top: 0; display: flex; gap: 6px; align-items: center; will-change: transform;
    font-size: 10px; letter-spacing: .02em; font-variant-numeric: tabular-nums; color: rgba(0,0,0,.55); white-space: nowrap;
  }
  .hud-chip i {
    width: 12px; height: 12px; border-radius: 50%; flex: none;
    box-shadow: 0 0 0 1.5px #fff, 0 1px 6px rgba(0,0,0,.25);
  }

  /* ---------- Bayer Dither interaction styles ---------- */
  .ix-pick { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 3px; pointer-events: auto; max-width: 340px; }
  .ix-pick[hidden] { display: none; }
  .ix-pick button {
    font: inherit; font-size: 10.5px; border: 1px solid var(--pill-border); background: var(--pill); color: var(--ink);
    padding: 4px 8px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s;
  }
  .ix-pick button span { opacity: .45; margin-right: 4px; }
  .veil-row { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 3px; align-items: center; margin-top: 4px; justify-content: inherit; }
  .veil-row > span { font-size: 10.5px; opacity: .5; margin-right: 4px; }
  .ix-pick button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .ix { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .ix > div { position: absolute; left: 0; top: 0; will-change: transform; }
  .ix-swarm { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ix .tiny { font-size: 10px; letter-spacing: .02em; color: rgba(0,0,0,.55); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ix .knob { position: absolute; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff, 0 2px 8px rgba(0,0,0,.28); }

  .rl-bottom, .rl-left { position: fixed; left: 0; display: none; will-change: transform; }
  .rl-bottom { top: calc(100vh - 40px); width: 100vw; height: 40px; }
  .rl-left { top: 0; width: 48px; height: 100vh; }
  .goo-svg { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: visible; }

  /* Ring */
  .ring-band {
    position: absolute; width: 184px; height: 184px; margin: -92px 0 0 -92px; border-radius: 50%;
    background: conic-gradient(hsl(0 90% 55%), hsl(60 90% 55%), hsl(120 90% 50%), hsl(180 90% 50%), hsl(240 90% 60%), hsl(300 90% 55%), hsl(360 90% 55%));
    -webkit-mask: radial-gradient(circle, transparent 84px, #000 85px, #000 91px, transparent 92px);
            mask: radial-gradient(circle, transparent 84px, #000 85px, #000 91px, transparent 92px);
  }
  .ring-sat { position: absolute; width: 168px; height: 168px; margin: -84px 0 0 -84px; border-radius: 50%;
    background: radial-gradient(circle, rgba(120,120,120,.28), rgba(120,120,120,0) 70%); }
  .ring-spoke { position: absolute; left: 0; top: 0; overflow: visible; }
  .ring-spoke line { stroke: var(--ink); stroke-width: 1; opacity: .2; }
  .ring-knob { width: 14px; height: 14px; margin: -7px 0 0 -7px; }
  .ring-label { position: absolute; transform: translate(-50%, 104px); }

  /* Dials */
  .dial-h, .dial-v { position: absolute; border-radius: 999px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 6px 18px -8px rgba(0,0,0,.3); transition: opacity .2s; }
  .dial-h { width: 220px; height: 16px; margin-left: -110px; }
  .dial-v { width: 16px; height: 140px; margin-top: -70px; }
  .dial-h::after, .dial-v::after { content: ""; position: absolute; background: var(--ink); box-shadow: 0 0 0 1px #fff; }
  .dial-h::after { left: 50%; top: 1px; bottom: 1px; width: 2px; margin-left: -1px; }
  .dial-v::after { top: 50%; left: 1px; right: 1px; height: 2px; margin-top: -1px; }
  .dial-read { position: absolute; transform: translate(-50%, 24px); }
  .reels { position: absolute; display: flex; gap: 3px; align-items: center; }
  .reel { width: 14px; height: 14px; overflow: hidden; border-radius: 4px; box-shadow: 0 0 0 1.5px #fff, 0 2px 8px rgba(0,0,0,.25); }
  .reel div { display: flex; flex-direction: column; }
  .reel i { display: block; width: 14px; height: 14px; flex: none; }
  .reels .tiny { margin-left: 6px; }

  /* Stick */
  .stick-base {
    position: absolute; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%;
    background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1px rgba(0,0,0,.1), 0 8px 24px -10px rgba(0,0,0,.3);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .stick-base b { position: absolute; background: rgba(0,0,0,.25); border-radius: 2px; transition: background .15s, transform .15s; }
  .stick-base b.l, .stick-base b.r { width: 8px; height: 2px; top: 37px; }
  .stick-base b.u, .stick-base b.d { width: 2px; height: 8px; left: 37px; }
  .stick-base b.l { left: 6px; } .stick-base b.r { right: 6px; } .stick-base b.u { top: 6px; } .stick-base b.d { bottom: 6px; }
  .stick-base b.on { background: var(--ink); }
  .stick-band { position: absolute; left: 0; top: 0; overflow: visible; }
  .stick-band line { stroke: var(--ink); stroke-linecap: round; opacity: .35; }
  .stick-knob { width: 20px; height: 20px; margin: -10px 0 0 -10px; }

  /* Field */
  .field {
    position: absolute; width: 900px; height: 120px; border-radius: 10px;
    background:
      linear-gradient(to bottom, rgba(140,140,140,0), rgba(140,140,140,1)),
      linear-gradient(90deg, hsl(0 95% 55%), hsl(60 95% 55%), hsl(120 90% 48%), hsl(180 90% 50%), hsl(240 90% 60%), hsl(300 90% 58%), hsl(360 95% 55%));
    background-size: 100% 100%, 300px 100%;
    -webkit-mask: linear-gradient(90deg, transparent, #000 36%, #000 64%, transparent);
            mask: linear-gradient(90deg, transparent, #000 36%, #000 64%, transparent);
    opacity: .72;
  }
  .field-cross { width: 18px; height: 18px; margin: -9px 0 0 -9px; }
  .field-read { position: absolute; transform: translate(14px, 12px); }
  /* scenes that own the whole page: light UI on dark scenes, room for Edit Mode's rulers */
  header { transition: color .45s, top .45s cubic-bezier(.3,1.4,.5,1), left .45s cubic-bezier(.3,1.4,.5,1); }
  nav, nav button { transition: background .35s, color .35s, border-color .35s; }
  body.dark header { color: #f1f1f1; }
  body.dark nav { background: rgba(14,14,20,.55); border-color: rgba(255,255,255,.1); box-shadow: 0 10px 30px -12px rgba(0,0,0,.6); }
  body.dark nav button { color: #eee; }
  body.dark nav button:hover { background: rgba(255,255,255,.1); }
  body.dark nav .pick, body.dark nav .pick:hover { background: #fff; color: #111; }
  /* per-effect switches (e.g. Flashbulb's drips) */
  .fx-toggles { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto; }
  .fx-toggles[hidden] { display: none; }
  .tog {
    font: inherit; font-size: 11px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 4px 10px 4px 5px; border-radius: 999px; border: 1px solid var(--pill-border); background: var(--pill); color: var(--ink);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .tog .track { position: relative; width: 26px; height: 15px; border-radius: 999px; background: rgba(0,0,0,.16); transition: background .25s; }
  .tog .track i {
    position: absolute; left: 2px; top: 2px; width: 11px; height: 11px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .4s cubic-bezier(.3,1.6,.5,1);
  }
  .tog[aria-checked="true"] .track { background: var(--ink); }
  .tog[aria-checked="true"] .track i { transform: translateX(11px); }
  .tog:active .track i { width: 14px; }
  .seg {
    position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px;
    border-radius: 999px; border: 1px solid var(--pill-border); background: var(--pill);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .seg::before {
    content: ""; position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / 2); border-radius: 999px;
    background: var(--ink); transform: translateX(calc(var(--k, 0) * 100%)); transition: transform .45s cubic-bezier(.3,1.5,.5,1);
  }
  .seg button {
    position: relative; font: inherit; font-size: 11px; border: 0; background: transparent; color: var(--ink);
    padding: 4px 12px; border-radius: 999px; cursor: pointer; transition: color .25s;
  }
  .seg button[aria-checked="true"] { color: #fff; }
  body.dark .tog { background: rgba(14,14,20,.55); border-color: rgba(255,255,255,.12); color: #eee; }
  body.dark .tog[aria-checked="true"] .track { background: #fff; }
  body.dark .tog[aria-checked="true"] .track i { background: #111; }
  body.dark .fx-menu { background: rgba(20,20,26,.82); border-color: rgba(255,255,255,.1); }
  body.dark .fx-menu button { color: #eee; }
  body.dark .fx-menu button:hover, body.dark .fx-menu button:focus-visible { background: rgba(255,255,255,.1); }
  body.dark .fx-menu .grp { color: #fff; }
  body.dark .fx-status i { box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
  /* Edit Mode: the header floats over the canvas like a design tool's panel */
  body.fx-edit header { top: 34px; left: 34px; right: 20px; }
  header > div { transition: background .35s, box-shadow .35s, padding .35s; border-radius: 10px; }
  body.fx-edit header > div { background: rgba(255,255,255,.94); padding: 12px 14px; box-shadow: 0 0 0 1px rgba(0,0,0,.07), 0 8px 24px -10px rgba(0,0,0,.22); }
  .edit-cv { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; display: none; }

  html.embed canvas { touch-action: pan-y; }
  /* landing */
  body.landing header, body.landing nav, body.landing .fx-menu, body.landing .ix-pick { display: none !important; }
  .landing-intro { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 20; pointer-events: none; }
  .fallback { position: fixed; inset: 0; display: none; place-items: center; padding: 16px; text-align: center; }

  @media (max-width: 640px) {
    header { top: 14px; left: 16px; right: 16px; }
    .hint { display: none; }
    .fx-name { font-size: 18px; }
    nav { bottom: 16px; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas class="edit-cv" id="editCv"></canvas>

<header>
  <div>
    <div class="fx-group" id="fxGroup"></div>
    <div class="fx-name" id="fxName"></div>
    <div class="fx-desc" id="fxDesc"></div>
    <div class="fx-status" id="fxStatus" hidden></div>
    <div class="ix-pick" id="ixPick" hidden></div>
    <div class="fx-toggles" id="fxToggles" hidden></div>
  </div>
  <div class="hint">
    hover the type<br />
    <kbd>←</kbd><kbd>→</kbd> switch effect<br />
    click &amp; drag to play<br />
    <kbd>R</kbd> replay intro<br />
    <a class="xlink" href="intros.html">Intro Lab →</a>
  </div>
</header>

<div class="hud" id="hud">
  <svg class="hud-lines"><line id="hudLine" /></svg>
  <div class="hud-origin" id="hudOrigin"><span class="arm-h" id="hudArmH"></span><span class="arm-v" id="hudArmV"></span><i></i></div>
  <div class="hud-chip" id="hudChip"><i id="hudSwatch"></i><span id="hudText"></span></div>
</div>

<div class="ix" id="ix"><canvas class="ix-swarm" id="ixSwarm"></canvas><canvas class="ix-swarm" id="ixFx"></canvas></div>

<nav id="nav">
  <button type="button" class="step" id="navPrev" aria-label="Previous effect">‹</button>
  <button type="button" class="pick" id="navPick" aria-haspopup="listbox" aria-expanded="false" aria-controls="navMenu">
    <span class="grp" id="navGrp"></span><span class="name" id="navName"></span>
    <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 6.5 5 3.5 8 6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button type="button" class="step" id="navNext" aria-label="Next effect">›</button>
</nav>
<div class="fx-menu" id="navMenu" role="listbox" aria-label="Effects"></div>
<div class="fallback" id="fallback">WebGL2 isn't available in this browser.</div>

<script>
// ?landing: full-screen Color Pixelate intro → plain black vector → first click wakes up Bayer Dither
const LANDING = new URLSearchParams(location.search).has("landing");
let dormant = LANDING, introDone = !LANDING, landingWake = null, landingSkip = null;
let inkMask = null;
// ?spray: a second landing page — just Spray Paint, full screen, no controls
const SPRAY_PAGE = new URLSearchParams(location.search).has("spray");
// softer flashes (Searchlight, Totality) for people whose system asks for reduced motion
const SAFE = matchMedia("(prefers-reduced-motion: reduce)").matches;
// ?flash: the Flashbulb page — full screen, no controls, and it loads in with a flash (?finish=spray|puff picks the ink)
const FLASH_PAGE = new URLSearchParams(location.search).has("flash");
// ?embed: the page sits inside another page's hero box — fit the type to the frame, and let touches scroll the host page
const EMBED = new URLSearchParams(location.search).has("embed");
if (EMBED) document.documentElement.classList.add("embed");
// when embedded as a full-window layer, the host page tells us where its hero box is (css px, in the window)
let EMBED_BOX = null;
let EMBED_INK = false;   // the host says the pointer is over something of its own that should flash (its photos)
if (LANDING || SPRAY_PAGE || FLASH_PAGE) document.body.classList.add("landing");
// =====================================================================
//  Shared GLSL
// =====================================================================
const COMMON = `
precision highp float;
uniform sampler2D uField, uTrail;
uniform vec2 uRes, uMouse, uVel;
uniform vec4 uRect;
uniform float uSprayIn; // Spray Paint: 0 = the clean vector, 1 = fully sprayed
uniform vec3 uPal[3];   // Bayer Dither's dark / mid / light
uniform vec3 uPalB[3];  // the outgoing palette, still showing outside a bloom
uniform vec4 uBloom;    // bloom centre (px), radius (px), dithered edge width (px); width 0 = off
uniform float uPlain;   // 1 = outside the bloom shows the plain crisp vector (landing, before waking)
uniform float uVeil;    // 0 → 1: chunkier pixels + washed-out grey, so a label on top reads clearly
uniform float uTime, uHover, uRadius, uDpr, uFlood, uPress, uDrip;
uniform float uIntro;   // seconds since this effect was switched on: each scene plays its own intro off this
uniform float uCell;    // device px per rendered pixel (a scene can render low-res and get scaled up)
uniform vec4 uS, uS2, uS3;  // scene state driven from JS
uniform vec4 uPing[8];  // short-lived events: xy (px), age (s), size
uniform vec4 uStar[4];  // the four stars: centre (px), radius (px), flare 0–1
uniform vec3 uQuad[8];  // Sundial: the 4-colour palette (0–3) and the one it's replacing (4–7)
uniform sampler2D uSim; // Culture: reaction–diffusion state (U, V, strain tag)
uniform sampler2D uLayer; // Flashbulb: the stars you've sprayed on, in the field's channels (screen-aligned)
uniform float uSafe;      // 1 = reduce flashing: flashes stay small and local, nothing pulses the whole screen
uniform vec4 uObj[48];    // scene objects from JS (stickers, newborn stars, meteors…): what they mean is up to the scene
uniform int uObjN;
uniform sampler2D uJfa;   // jump-flood map: RG nearest ink point, BA nearest paper point (logo uv, y up)
uniform vec2 uJfaSize;
out vec4 o;

const vec3 PAPER = vec3(1.0);
const vec3 INK = vec3(0.055);
const float TAU = 6.28318;

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
vec2 hash2(vec2 p){ return vec2(hash(p), hash(p + vec2(37.1, 11.3))); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){
  float s = 0., a = .5;
  mat2 r = mat2(.8, .6, -.6, .8);
  for (int i = 0; i < 5; i++) { s += a*noise(p); p = r*p*2.03 + 11.7; a *= .5; }
  return s/0.97;
}
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
vec3 pal(float t){ return 0.5 + 0.5*cos(TAU*(t + vec3(0., .33, .67))); }
vec3 rainbow(float x){ return clamp(abs(mod(x*6. + vec3(0., 4., 2.), 6.) - 3.) - 1., 0., 1.); }

vec4 F(vec2 p){
  vec2 uv = (p - uRect.xy)/uRect.zw; uv.y = 1. - uv.y;
  if (uv.x < 0. || uv.y < 0. || uv.x > 1. || uv.y > 1.) return vec4(0);
  return texture(uField, uv);
}
float A(vec2 p){ return F(p).r; }     // crisp ink coverage
float Hs(vec2 p){ return F(p).g; }    // small blur (bevel)
float Hl(vec2 p){ return F(p).b; }    // large blur (soft body)
float hgt(vec2 p){ vec4 f = F(p); return f.g*0.65 + f.b*0.35; }
vec3 nrm(vec2 p, float k){
  float e = 3.*uDpr;
  float dx = hgt(p+vec2(e,0)) - hgt(p-vec2(e,0));
  float dy = hgt(p+vec2(0,e)) - hgt(p-vec2(0,e));
  return normalize(vec3(-dx*k, -dy*k, 1.));
}
float trail(vec2 p){ return texture(uTrail, p/uRes).r; }
vec2 LC(){ return uRect.xy + uRect.zw*0.5; }
vec2 logoUV(vec2 p){ return (p - uRect.xy)/uRect.zw; }
float starM(vec2 p){ return F(p).a; } // soft mask of just the four stars
float eob(float k){ k = clamp(k, 0., 1.); float m = k - 1.; return 1. + 2.70158*m*m*m + 1.70158*m*m; }   // ease-out-back
vec3 aces(vec3 x){ return clamp((x*(2.51*x + 0.03))/(x*(2.43*x + 0.59) + 0.14), 0., 1.); }
// signed distance to the ink (device px, negative inside) and the nearest point across the edge (device px)
vec3 SD(vec2 p){
  vec2 uv = (p - uRect.xy)/uRect.zw;
  vec4 j = texelFetch(uJfa, ivec2(clamp(uv, 0., 0.9999)*uJfaSize), 0);
  bool inside = A(p) > 0.5;
  vec2 s = uRect.xy + (inside ? j.zw : j.xy)*uRect.zw;
  float d = length(p - s);
  return vec3(inside ? -d : d, s);
}
// iq's five-pointed star (r: outer radius, rf: how deep the notches go)
float sdStar5(vec2 p, float r, float rf){
  const vec2 k1 = vec2(0.809016994375, -0.587785252292), k2 = vec2(-0.809016994375, -0.587785252292);
  p.x = abs(p.x);
  p -= 2.*max(dot(k1, p), 0.)*k1;
  p -= 2.*max(dot(k2, p), 0.)*k2;
  p.x = abs(p.x);
  p.y -= r;
  vec2 ba = rf*vec2(-k1.y, k1.x) - vec2(0., 1.);
  float h = clamp(dot(p, ba)/dot(ba, ba), 0., r);
  return length(p - ba*h)*sign(p.y*ba.x - p.x*ba.y);
}


float bayer2(vec2 a){ a = floor(a); return fract(dot(a, vec2(.5, a.y*.75))); }
float bayer4(vec2 a){ return bayer2(.5*a)*.25 + bayer2(a); }
float bayer8(vec2 a){ return bayer4(.5*a)*.25 + bayer2(a); }
`;

// The effect only ever replaces the vector: fx.a is the (possibly displaced)

const MAIN = `
void main(){
  vec2 p = gl_FragCoord.xy;
  vec3 base = mix(PAPER, INK, A(p));

  float raw = (1. - smoothstep(uRadius*0.25, uRadius, length(p - uMouse)))*uHover;
  raw = max(raw, trail(p));
  raw = max(raw, uFlood);
  float n = fbm(p/uDpr*0.01 + vec2(uTime*0.2, -uTime*0.15));
  float m = smoothstep(n*0.7, n*0.7 + 0.2, raw);
#ifdef FULL_MASK
  m = 1.;
#endif
#ifndef DISPLACES
  if (Hl(p) < 0.002) m = 0.;
#endif
  vec3 col = base;
  if (m > 0.001) {
    vec4 fx = effect(p, m);
    col = mix(base, mix(PAPER, fx.rgb, clamp(fx.a, 0., 1.)), m);
  }
  o = vec4(col, 1.);
}`;

vec4 effect(vec2 p, float m){
  vec2 P = p/uDpr;
  vec4 f = F(p);
  vec2 rel = (p - uMouse)/uDpr;
  float nozzle = exp(-dot(rel, rel)/(2.*120.*120.))*uHover*(0.4 + 0.6*uPress) + trail(p)*0.5*uHover;
  float n1 = fbm(P*0.035);
  float sprayK = smoothstep(0., 1., uSprayIn);
  float body = mix(A(p), smoothstep(0.36, 0.6, f.g + (n1 - 0.5)*0.2), sprayK);
  // overspray speckle thins out away from the letters; near the nozzle it flickers (but never spreads onto the page)
  float halo = (pow(f.b, 1.3)*0.55 + f.g*0.25)*uSprayIn;
  float live = step(0.05, nozzle);
  float rnd = mix(hash(floor(P*1.3)), hash(floor(P*1.3) + floor(uTime*20.)), live*0.5);
  float speck = step(1. - halo, rnd);
  float dust = smoothstep(0.15, 0.45, f.g)*step(0.55, hash(floor(P*2.) + 3.))*0.6*sprayK;
  float d = drip(p, P);
  float cov = clamp(max(max(body, speck*0.95), max(dust, d)), 0., 1.);

  vec3 nn = normalize(vec3(-(Hs(p + vec2(e, 0.)) - Hs(p - vec2(e, 0.)))*6., -(Hs(p + vec2(0., e)) - Hs(p - vec2(0., e)))*6., 1.));

float tall(vec2 X){

// how much of the sun's light reaches X: falls off with distance across the page (uS2.y = its reach)

vec3 scene(vec2 p){
  vec2 P = p/uDpr;
  vec2 ci = floor(p/uCell);
  float th = bayer8(ci), th2 = bayer8(ci.yx + vec2(5., 3.));
  vec2 CAM = vec2(uRes.x*0.5, -uRes.y*0.3)/uDpr;       // the viewer stands in front of the page, looking down at it
  vec3 L = vec3(uS.xy/uDpr, uS.z);
  vec3 Lj = L + vec3((vec2(th, th2) - 0.5)*16., 0.);   // an area light: the ordered jitter dithers the penumbra
  float night = uS2.w;

  // what does this pixel see? march down from above the tallest letter
  float Hm = uS2.x*1.12, stepH = Hm/13.;
  float hitH = -1.; vec2 X = P;
  for (int i = 0; i < 13; i++) {
    float h = Hm*float(13 - i)/13.;
    vec2 Xh = CAM + (P - CAM)*(ZC - h)/ZC;
    if (h <= tall(Xh) + 0.5 && inkAt(Xh) > 0.5) { hitH = h; X = Xh; break; }
  }
  // page level, checked on its own (a flat letter, before it has risen)
  if (hitH < 0. && inkAt(P) > 0.5) hitH = 0.;

  float v;
  if (hitH < 0.) {
    // the page: a pool of light round the sun (how high it is only changes the shadows), then the cast shadows
    v = 0.03 + 0.68*reach(P, L)*lightAt(P, Lj, th);
    // sundial hour lines fanning out from under the type, drawn in during the intro
    vec2 g = P - vec2(uRes.x*0.5/uDpr, (uRect.y + uRect.w*0.16)/uDpr);
    float hr = atan(g.x, g.y)/0.2618;
    float line = step(abs(fract(hr + 0.5) - 0.5)*0.2618*length(g), 1.6)*step(60., length(g))*step(abs(hr), 6.5);
    v += line*step(abs(hr), (uIntro - 0.4)*10.)*0.11;
    v += night*smoothstep(0.03, 0.5, starM(p))*0.4;       // starlight spills onto the page
    float tw = hash(ci*0.37 + 3.1);                          // and at night the page itself fills with little stars
    v += night*step(0.994, tw)*(0.5 + 0.5*sin(uTime*(1.5 + tw*6.) + tw*80.));
  } else if (hitH > tall(X) - stepH - 0.5) {
    // a letter's top: lit from the lamp, bevelled at the edges, with a dark keyline
    vec3 dl = L - vec3(X, hitH); float d = length(dl);
    vec3 n = nrm(X*uDpr, 6.);
    v = 0.56 + 0.5*reach(X, L)*mix(1., max(dot(n, dl/d), 0.), 0.5);
    if (Hs(X*uDpr) < 0.7) v = min(v, 0.1);
    v = mix(v, 1., night*smoothstep(0.4, 0.7, starM(X*uDpr)));   // at night the stars glow from within
  } else {
    // a letter's side: its normal is the footprint's outward normal
    vec2 e = vec2(1.5, 0.);
    vec2 gr = vec2(Hs((X + e.xy)*uDpr) - Hs((X - e.xy)*uDpr), Hs((X + e.yx)*uDpr) - Hs((X - e.yx)*uDpr));
    vec3 n = vec3(-gr/max(length(gr), 1e-5), 0.);
    vec3 dl = L - vec3(X, hitH); float d = length(dl);
    v = 0.08 + 0.62*max(dot(n, dl/d), 0.)*reach(X, L);
  }

  float lvl = clamp(floor(v*3. + th), 0., 3.);

  // the lamp: a little pixel sun with turning rays (a crescent moon at night)
  vec2 ds = P - L.xy; float rr = length(ds), pop = uS3.w;
  if (pop > 0.02) {
    float spin = atan(ds.y, ds.x) + uTime*0.7;
    float rays = step(0.6, cos(spin*8.))*step(12.*pop, rr)*step(rr, 19.*pop)*step(night, 0.5);
    float bite = step(length(ds - vec2(4.5, 3.5)*pop), 7.*pop)*step(0.5, night);
    if (rr < 8.5*pop) lvl = bite > 0.5 ? 0. : 3.;
    else if (rr < 11.*pop || rays > 0.5) lvl = 0.;
  }

  // a new time of day spreads from the click in a dithered ring
  bool fresh = length(p - uS3.xy) - uS3.z < (th - 0.5)*30.*uDpr;
  vec3 c0 = fresh ? uQuad[0] : uQuad[4], c1 = fresh ? uQuad[1] : uQuad[5];
  vec3 c2 = fresh ? uQuad[2] : uQuad[6], c3 = fresh ? uQuad[3] : uQuad[7];
  vec3 col = lvl < 0.5 ? c0 : (lvl < 1.5 ? c1 : (lvl < 2.5 ? c2 : c3));
  // intro: the plain page dissolves into the scene, in dither order
  if (th > smoothstep(0.02, 0.5, uIntro)) col = mix(PAPER, INK, step(0.5, A(p)));
  return col;
}` },

  float pe = abs(v.x*dir.y - v.y*dir.x);

  vec2 Ft = uS.xy; float R = uS.z, I = uS.w; vec3 gel = uS2.rgb;
  vec2 Fs = vec2(uRes.x*0.5, -uRes.y*0.4);
  vec2 fd = Ft - Fs; float fl = length(fd); vec2 fdir = fd/max(fl, 1.);
  vec2 fv = p - Fs; float fal = dot(fv, fdir), fpe = abs(fv.x*fdir.y - fv.y*fdir.x);
  float fw = mix(4.*uDpr, R*0.92, clamp(fal/fl, 0., 1.));
  float cone = (1. - smoothstep(fw*0.35, fw, fpe))*smoothstep(0., fl*0.5, fal)*(1. - smoothstep(fl*0.96, fl*1.01, fal));
  vec2 q = (p - Ft)*vec2(1., 1.12);
  float r = length(q);
  // the pool, with the colour fringe a real ellipsoidal spot has at its gate
  vec3 pool = vec3(1. - smoothstep(R*0.95, R*1.01, r), 1. - smoothstep(R*0.935, R*0.995, r), 1. - smoothstep(R*0.915, R*0.98, r));
  float hot = exp(-r*r/(R*R*0.55));
  float mote = step(0.985, hash(floor(P/2.) + floor(uTime*3.)));    // specks of dust catching the light
  sky += gel*(pool*(0.05 + 0.07*hot + mote*0.12*hot)*haze + cone*0.1*haze)*I;
  sky += vec3(0.1, 0.11, 0.2)*Hl(p)*0.5*city;                       // haze glowing behind the sign keeps it readable
  float house = 1. - 0.45*uS2.w;                                     // holding the pin spot takes the house lights down

  // ---- the sign ----
  float a = A(p), st = starM(p);
  vec3 col = sky;
  if (a > 0.002) {
    vec3 n = nrm(p, 10.);
    vec3 lc = vec3(0.01, 0.012, 0.024);
    lc += vec3(1., 0.45, 0.18)*pow(clamp(-n.y, 0., 1.), 1.2)*(1. - n.z)*0.9*city*house;  // warm rim from the city
    lc += vec3(0.25, 0.3, 0.5)*pow(clamp(n.y, 0., 1.), 1.5)*(1. - n.z)*0.35*house;       // cool rim from the sky
    lc += cool*beams*(0.5 + 0.5*n.z)*0.9*house;
    vec3 Ls = normalize(vec3((Fs - p)/uRes.y*0.7, 1.));
    float dif = 0.4 + 0.6*max(dot(n, Ls), 0.);
    float spec = pow(max(dot(n, normalize(Ls + vec3(0., 0., 1.))), 0.), 70.);
    lc += gel*(vec3(0.98, 0.93, 0.83)*dif*(0.8 + 0.5*hot) + spec*1.4)*pool*I;
    // the four stars burn gold
    lc = mix(lc, vec3(1., 0.78, 0.35)*(1.1 + 0.5*n.z)*(0.8 + 0.2*sin(uTime*3. + P.x*0.05)), smoothstep(0.35, 0.6, st)*0.85);
    col = mix(sky*mix(1., house, 1. - pool.g), lc, a);
  }
  else col = sky*mix(1., house, 1. - pool.g);
  col += vec3(1., 0.7, 0.3)*smoothstep(0.02, 0.5, st)*(1. - a)*0.25;

  // star flares: an anamorphic streak, a halo, and lens ghosts strung through the middle of frame
  vec2 C = uRes*0.5;
  for (int i = 0; i < 4; i++) {
    vec4 s = uStar[i];
    if (s.w < 0.01) continue;
    vec2 d = (p - s.xy)/uDpr;
    col += (vec3(0.55, 0.7, 1.)*exp(-abs(d.y)*0.7 - abs(d.x)*0.006)*1.2 + vec3(1., 0.85, 0.6)*exp(-length(d)*0.05)*0.8)*s.w;
    for (int g = 0; g < 3; g++) {
      float fg = float(g);
      vec2 G = C + (C - s.xy)*(0.35 + fg*0.45);
      float rg = (18. + fg*22.)*uDpr, dg = length(p - G);
      float ring = smoothstep(rg, rg*0.86, dg)*0.5 + exp(-pow((dg - rg)/(2.*uDpr), 2.))*0.8;
      col += (g == 0 ? vec3(0.3, 1., 0.6) : (g == 1 ? vec3(1., 0.35, 0.8) : vec3(0.35, 0.55, 1.)))*ring*0.05*s.w;
    }
  }

  // camera flashes: a hot core, a starburst, and a flash of light across everything (the type most of all)
  float expo = 0.;
  vec3 flash = vec3(0.);
  for (int i = 0; i < 8; i++) {
    vec4 f = uPing[i];
    if (f.z < 0. || f.z > 0.7) continue;
    float k = exp(-f.z*8.)*smoothstep(0., 0.015, f.z);
    vec2 d = (p - f.xy)/uDpr;
    float core = exp(-dot(d, d)/(2.*36.*f.w*f.w));
    float glow = exp(-length(d)/(55.*f.w));
    float sx = exp(-abs(d.y)*0.9 - abs(d.x)/(220.*f.w));
    float sy = exp(-abs(d.x)*0.9 - abs(d.y)/(70.*f.w));
    flash += vec3(1., 0.97, 0.93)*k*(core*3. + glow*0.6 + sx*0.9 + sy*0.45);
    expo += k*f.w;
  }
  expo *= 1. - 0.85*uSafe; flash *= 1. - 0.5*uSafe;
  col = col*(1. + expo*0.5) + vec3(0.2, 0.21, 0.25)*expo*0.2 + vec3(0.95, 0.93, 0.9)*a*expo*0.9;
  col += flash;

  // the crowd in front of the stage, two rows deep, lit only by the flashes and their phone screens
  float ph1, ph2;
  float back = crowd(P + vec2(19., 0.), 34., 0., 11., ph2);
  float front = crowd(P, 46., -12., 3., ph1);
  vec3 crowdCol = vec3(0.012, 0.012, 0.02) + vec3(0.9, 0.9, 1.)*expo*0.12;
  col = mix(col, crowdCol*1.6 + vec3(0.02, 0.02, 0.035), back*(1. - front));
  col = mix(col, crowdCol, front);
  col += vec3(0.55, 0.7, 1.)*(ph1*front + ph2*back*(1. - front))*(0.55 + 0.45*sin(uTime*2. + P.x));

  col *= 1. - 0.4*pow(length((p/uRes - 0.5)*vec2(1., 1.25)), 2.);
  col = aces(col*1.15);
  col += (hash(P + fract(uTime*7.)*91.) - 0.5)*0.03;                  // film grain
  // lights out: the plain page fades to night first
  return mix(mix(PAPER, INK, A(p)), col, smoothstep(0., 0.35, T));
}` },

flashbulb: { group: "Stage", name: "Flashbulb", scene: true, idle: false,
  toggles: { finish: { options: ["Spray", "Puff"], value: 0 } },
  desc: "Black ink on white, as spray paint (drips and overspray) or as a raised puff print lit by your cursor. Click the ink (any letter or star) and the paparazzi go off: the ink blows out to white and the page drops to a flat grey as the flashes overpower it. Click the empty page to add a star there. Hold on the ink for burst mode.",
  helpers: `
// the vector plus any stars you've sprayed on (uLayer is drawn to match the field's channels)
vec4 FF(vec2 p){ return max(F(p), texture(uLayer, p/uRes)); }
float AA(vec2 p){ return FF(p).r; }
// puff print: how high the ink stands: steep at the edge, rounded over the top
float puffH(vec2 q){ return sqrt(clamp((FF(q).g - 0.4)/0.6, 0., 1.)); }
// drips as in Spray Paint, but kept short: they only just start to run
float dripS(vec2 p, vec2 P){
  float w = 6.;
  float col = floor(P.x/w);
  float h = hash(vec2(col, 3.1));
  if (h < 0.7) return 0.;
  float grow = mix(5., 17., hash(vec2(col, 7.7)))*clamp(uDrip*0.12*(0.6 + h) - hash(vec2(col, 1.3))*0.8, 0., 1.);
  if (grow < 1.) return 0.;
  float cx = (col + 0.3 + 0.4*hash(vec2(col, 5.2)))*w;
  float dx = abs(P.x - cx);
  if (dx > 4.) return 0.;
  float found = -1.;
  for (int i = 0; i < 8; i++) {
    float s = float(i)/7.*grow;
    if (found < 0. && AA(p + vec2(0., s*uDpr)) > 0.5) found = s;
  }
  if (found <= 0.) return 0.;
  float t = found/grow;
  float wdt = mix(1.6, 0.9, t) + 1.4*smoothstep(0.8, 1., t);
  return 1. - smoothstep(wdt - 0.6, wdt + 0.6, dx);
}`,
  src: `
vec3 scene(vec2 p){
  vec2 P = p/uDpr;
  float K = uS.x;                                   // how blown-out the frame is: 0 is the plain page
  vec4 f = FF(p);

  float m = uS.z;                                   // the finish: 1 spray paint, 0 puff print (eased between)

  // ---- spray paint: soft uneven body, overspray speckle, short drips, a wet sheen under the nozzle ----
  vec2 rel = (p - uMouse)/uDpr;
  float nozzle = exp(-dot(rel, rel)/(2.*120.*120.))*uHover*(0.4 + 0.6*uPress)*(1. - K);
  float n1 = fbm(P*0.035);
  float sprayK = smoothstep(0., 1., uSprayIn);
  float body = mix(f.r, smoothstep(0.36, 0.6, f.g + (n1 - 0.5)*0.2), sprayK*m);
  float halo = (pow(f.b, 1.3)*0.55 + f.g*0.25)*uSprayIn;
  float rn = mix(hash(floor(P*1.3)), hash(floor(P*1.3) + floor(uTime*20.)), step(0.05, nozzle)*0.5);
  float speck = step(1. - halo, rn);
  float dust = smoothstep(0.15, 0.45, f.g)*step(0.55, hash(floor(P*2.) + 3.))*0.6*sprayK;
  float dr = m > 0.001 && uS2.z < 0.5 ? dripS(p, P)*sprayK*m : 0.;   // uS2.z: no drips (the Flashbulb page)
  float solid = max(body, dr), mist = max(speck*0.95, dust)*m*(1. - uS2.z);   // (no overspray on the Flashbulb page)
  float cov = clamp(max(solid, mist), 0., 1.);
  vec3 paint = vec3(0.035) + (n1 - 0.5)*0.04;
  float e = 2.*uDpr;
  vec3 nn = normalize(vec3(-(FF(p + vec2(e, 0.)).g - FF(p - vec2(e, 0.)).g)*6., -(FF(p + vec2(0., e)).g - FF(p - vec2(0., e)).g)*6., 1.));
  vec3 L = normalize(vec3((uMouse - p)/uRes.y*2., .55));
  float spec = pow(max(dot(reflect(-L, nn), vec3(0., 0., 1.)), 0.), 9.);
  paint += vec3(0.62, 0.64, 0.7)*(spec*1.1 + exp(-dot(rel, rel)/(2.*170.*170.))*0.22)*clamp(nozzle*1.4 + 0.25*dr, 0., 1.)*body;
  vec3 col = mix(PAPER, paint, cov);

  // ---- puff print: raised, rounded, matte ink with a fine foamy grain, lit by a lamp at the cursor ----
  float dif = 1.;
  if (m < 0.999) {
    float inflate = sprayK;                                            // intro: it puffs up
    vec2 Lxy = mix(LC() + vec2(-0.3, 0.45)*uRect.zw, uMouse, uHover);  // away from the page, the light sits up and to the left
    float e2 = 2.5*uDpr;
    float hx = puffH(p + vec2(e2, 0.)) - puffH(p - vec2(e2, 0.));
    float hy = puffH(p + vec2(0., e2)) - puffH(p - vec2(0., e2));
    vec2 fq = P*0.45;
    float g0 = noise(fq), gx = noise(fq + vec2(0.3, 0.)), gy = noise(fq + vec2(0., 0.3));
    vec3 n = normalize(vec3(-hx*3.2*inflate - (gx - g0)*0.3, -hy*3.2*inflate - (gy - g0)*0.3, 1.));
    vec3 Ld = normalize(vec3(Lxy - p, 240.*uDpr));
    float fall = 1./(1. + pow(length(Lxy - p)/(650.*uDpr), 2.));
    dif = max(dot(n, Ld), 0.);
    float sp = pow(max(dot(n, normalize(Ld + vec3(0., 0., 1.))), 0.), 20.);
    float rim = smoothstep(0.02, 0.35, 1. - n.z);                        // satin: the sheen lives on the rounded edges
    vec3 ink = vec3(0.06, 0.06, 0.065)*(0.45 + 1.1*dif*fall) + sp*(0.06 + 0.5*rim)*fall*inflate;
    // under the cursor it catches the light like the spray paint did: a glossy highlight that shows the letters' dimension
    float wetP = clamp(exp(-dot(rel, rel)/(2.*120.*120.))*uHover*(1. - K)*1.4, 0., 1.);
    ink += vec3(0.62, 0.64, 0.7)*(spec*0.56 + exp(-dot(rel, rel)/(2.*170.*170.))*0.1)*wetP*f.r;
    col = mix(mix(PAPER, ink, f.r), col, m);   // the page stays clean white: no cast shadow
  }

  col = mix(PAPER, col, uS2.x);                     // (the Flashbulb page is blank until its first flash)

  // over empty page, a faint star traces where a click would add one
  vec2 q = rot(uTime*0.35)*(p - uMouse);
  float ghost = 1. - smoothstep(0.5*uDpr, 1.4*uDpr, abs(sdStar5(q, uS.w*0.95, 0.43) - uS.w*0.05));
  col = mix(col, INK, ghost*uS.y*0.3);
  // over the ink, the hint becomes a camera's autofocus brackets locking on (uS3.x: how visible, uS3.y: size)
  if (uS3.x > 0.001) {
    vec2 fq = abs(P - uMouse/uDpr);
    float hb = 12.*uS3.y, arm = 5.*uS3.y, tk = 0.8;
    float br = max(step(abs(fq.x - hb), tk)*step(hb - arm, fq.y)*step(fq.y, hb + tk),
                   step(abs(fq.y - hb), tk)*step(hb - arm, fq.x)*step(fq.x, hb + tk));
    br = max(br, 1. - smoothstep(1., 1.8, length(fq)));            // and a dot in the middle
    col = mix(col, vec3(1.) - col, br*uS3.x*0.85);                  // inverted, so it reads on ink and on paper
  }

  // ---- the flashes: a hot core, a starburst, and a surge of light across the whole frame ----
  float expo = 0.;
  vec3 fl = vec3(0.);
  for (int i = 0; i < 8; i++) {
    vec4 g = uPing[i];
    if (g.z < 0. || g.z > 0.7) continue;
    float k = exp(-g.z*9.)*smoothstep(0., 0.012, g.z);
    float sz = abs(g.w);
    vec2 d = (p - g.xy)/uDpr;
    float core = exp(-dot(d, d)/(2.*30.*sz*sz));
    float glow = exp(-length(d)/(70.*sz));
    float sx = exp(-abs(d.y)*0.8 - abs(d.x)/(260.*sz));
    float sy = exp(-abs(d.x)*0.8 - abs(d.y)/(90.*sz));
    float diag = exp(-abs(d.x + d.y)*0.7 - length(d)/(50.*sz)) + exp(-abs(d.x - d.y)*0.7 - length(d)/(50.*sz));
    fl += k*(core*2.5 + glow*0.3 + sx*0.7 + sy*0.35 + diag*0.2)*step(0., g.w);   // size < 0: your own camera, all exposure, no bulb
    expo += k*sz;
  }

  // blown out: the page goes a flat grey (a touch darker toward the corners, like a lens) that every pop
  // overpowers for an instant, and the paint turns white, haloed in spill, with a hair of colour fringing
  if (K > 0.001) {
    vec2 uv = p/uRes;
    vec3 grey = vec3(0.8, 0.8, 0.805)*(1. - 0.22*pow(length((uv - 0.5)*vec2(1.1, 1.3)), 1.8));
    grey = mix(grey, vec3(1.), clamp(expo*0.28, 0., 0.4));
    grey += (f.g*0.03 + f.b*0.05 + f.a*0.06)*(1. + 0.3*expo);
    // the painted body goes pure white; the overspray only a soft light grey, so the letters keep their edges
    vec3 hot = mix(grey, vec3(0.9), mist*(1. - solid));
    hot = mix(hot, vec3(1.)*mix(0.88 + 0.12*dif, 1., m), solid);
    vec2 o = vec2(1.2*uDpr, 0.);
    float fr = AA(p + o) - AA(p - o);
    hot += vec3(0.12, 0., -0.12)*fr;
    col = mix(col, hot, K);
    // the four stars catch every flash: an anamorphic streak and a halo
    for (int i = 0; i < 4; i++) {
      vec4 s = uStar[i];
      if (s.w < 0.01) continue;
      vec2 d = (p - s.xy)/uDpr;
      col += vec3(0.85, 0.92, 1.)*(exp(-abs(d.y)*0.8 - abs(d.x)*0.008)*0.6 + exp(-length(d)*0.06)*0.3)*s.w*K;
    }
    col += fl*K;
    col += (hash(P + fract(uTime*9.)*71.) - 0.5)*0.035*K;   // grain, only in the blown-out frame
  }
  return uS2.y > 0.5 ? vec3(1.) : clamp(col, 0., 1.);   // the load flash opens on a frame or two of pure white
}` },

nursery: { group: "Cosmos", name: "Nursery", scene: true, dark: true, jfa: true, needsFloat: true, idleAfter: 5000,
  desc: "Young stars are born in clouds of gas and dust, and here the letters are one: glowing gas, dark dust lanes and newborn stars with telescope-style diffraction spikes. The cursor is a gravity well that swirls and heats the gas, and new stars light up where you linger. Click anywhere to light a new star.",
  helpers: `
// a young star as a big space telescope sees it: a hot core, six diffraction spikes and two faint struts
vec3 spikes(vec2 d, float b, vec3 tint){
  float r = length(d);
  float L = 10. + 34.*b;
  if (r > L*3. + 20.) return vec3(0.);
  float core = exp(-r*r/1.4)*2.4 + exp(-r/2.4)*0.5 + exp(-r/11.)*0.13;
  float sp = 0.;
  for (int k = 0; k < 3; k++) {
    float a = 1.5708 + float(k)*1.0472;
    vec2 dir = vec2(cos(a), sin(a));
    sp += exp(-abs(d.x*dir.y - d.y*dir.x)*1.5)*exp(-abs(dot(d, dir))/L);
  }
  sp += exp(-abs(d.y)*1.8)*exp(-abs(d.x)/(L*0.45))*0.45;
  return tint*b*(core + sp*0.7);
}`,
  src: `
vec3 scene(vec2 p){
  vec2 P = p/uDpr;
  float T = uIntro;
  float d = SD(p).x/uDpr;                                      // css px from the letters' edge, < 0 inside
  // the cursor is a gravity well: the gas is drawn in, swirls and heats up
  vec2 toM = (uMouse - p)/uDpr;
  float well = exp(-dot(toM, toM)/(2.*120.*120.))*uHover;
  vec2 Q = P + toM*0.22*well + vec2(-toM.y, toM.x)*0.5*well;
  // the cloud gathers in the strokes during the intro; a few wisps drift off their edges
  float gather = smoothstep(0.25, 1.7, T);
  float inside = smoothstep(1.5, -5., d);
  float body = 0.;
  vec3 col = vec3(0.);
  float dust = 0.;
  if (d < 28. && gather > 0.) {
    float t = uTime;
    vec2 q = Q*0.0042;
    vec2 w1 = vec2(fbm(q + vec2(0., t*0.012)), fbm(q + vec2(5.2, 1.3) - t*0.01));
    vec2 w2 = vec2(fbm(q*1.8 + w1*2. + vec2(1.7, 9.2)), fbm(q*1.8 + w1*2. + vec2(8.3, 2.8)));
    float gas = fbm(q*2.3 + w2*1.7);
    body = (inside + smoothstep(28., 0., d)*(1. - inside)*smoothstep(0.5, 0.85, gas)*0.7)*gather;
    float dn = fbm(q*3.4 + w2*2.2 + 4.1);
    float dnL = fbm(q*3.4 + w2*2.2 + 4.1 + vec2(0.035, 0.05));   // a step toward the light: dust edges facing it catch fire
    dust = smoothstep(0.5, 0.74, dn);
    float front = clamp((dn - dnL)*9., 0., 1.)*smoothstep(0.42, 0.62, dn);
    // near-infrared colours: teal gas in the cavities, amber and rust in the dust
    vec3 gasC = mix(vec3(0.06, 0.3, 0.62), vec3(1., 0.5, 0.18), smoothstep(0.4, 0.75, gas + 0.15*w2.x));
    col = gasC*body*(0.06 + 0.8*pow(gas, 1.6))*(1. + well*1.8);
    col *= 1. - dust*0.92*body;
    col += vec3(0.32, 0.13, 0.05)*dust*body*0.3 + vec3(1., 0.7, 0.36)*front*body*1.4;
    float fil = pow(1. - abs(noise(q*14. + w2*3.)*2. - 1.), 6.);   // fine bright filaments threading the gas
    col += gasC*fil*body*0.4*(0.35 + gas)*(1. - dust*0.8);
    col = mix(col, col*vec3(0.75, 0.9, 1.25) + vec3(0.1, 0.14, 0.2)*well, well*0.6);
  }
  col += vec3(1., 0.8, 0.55)*exp(-abs(d)/1.6)*0.16*gather*(1. - dust*0.7);   // a bright lip along the cliffs
  // deep space: faint wisps and a sprinkle of distant stars
  vec3 space = vec3(0.004, 0.006, 0.016) + vec3(0.02, 0.03, 0.06)*fbm(P*0.0016 + 3.)*1.2;
  vec2 sc = floor(P/2.5); float sh = hash(sc);
  vec2 sf = fract(P/2.5) - 0.5 - (hash2(sc) - 0.5)*0.5;
  space += mix(vec3(0.7, 0.8, 1.), vec3(1., 0.8, 0.6), hash(sc + 9.))*step(0.992 - inside*gather*0.01, sh)*exp(-dot(sf, sf)*30.)*0.8*(1. - dust*body);
  col += space;
  // young stars (uObj: xy px, brightness, colour 0 blue-white … 3 deep orange)
  for (int i = 0; i < 48; i++) {
    if (i >= uObjN) break;
    vec4 s4 = uObj[i];
    if (s4.z <= 0.001) continue;
    vec3 tint = s4.w < 0.5 ? vec3(0.75, 0.85, 1.) : s4.w < 1.5 ? vec3(1., 0.97, 0.92) : s4.w < 2.5 ? vec3(1., 0.85, 0.6) : vec3(1., 0.55, 0.35);
    col += spikes(P - s4.xy/uDpr, s4.z, tint);
  }
  // a birth blows a bubble: the new star's wind clears a cavity with a shock front round its rim
  for (int i = 0; i < 8; i++) {
    vec4 g = uPing[i];
    if (g.z < 0. || g.z > 4.) continue;
    float R = 70.*g.w*(1. - exp(-g.z*1.6));
    float dr = length(P - g.xy/uDpr);
    col *= mix(1., 0.35 + 0.65*smoothstep(R*0.55, R, dr), body*exp(-g.z*0.35));
    col += vec3(1., 0.8, 0.55)*exp(-pow((dr - R)/3.5, 2.))*exp(-g.z*0.7)*body*1.2;
    col += vec3(0.8, 0.9, 1.)*exp(-g.z*7.)*exp(-dr/60.)*1.5;
  }
  col = aces(col*1.05);
  col += (hash(P + fract(uTime*7.)*91.) - 0.5)*0.025;
  return mix(mix(PAPER, INK, A(p)), col, smoothstep(0., 0.35, T));
}` },

totality: { group: "Cosmos", name: "Totality", scene: true, dark: true, jfa: true, needsFloat: true, idleAfter: 5000,
  desc: "A total eclipse where the type is the moon. The daylight drains away and the corona of a hidden star streams out around the letters' edges. Your cursor marks where the sun sits behind them, so the pink chromosphere and Baily's beads glint on that side. Click for the diamond ring.",
  src: `
vec3 scene(vec2 p){
  vec2 P = p/uDpr;
  float T = uIntro;
  float dark = smoothstep(0.15, 1.4, T);                        // daylight → totality
  float glow = smoothstep(1.1, 2.3, T);                         // the corona comes out at second contact
  vec3 s = SD(p);
  float d = s.x/uDpr;                                           // css px, < 0 inside the moon
  vec2 E = s.yz/uDpr;                                           // nearest point on the edge
  vec2 nv = d > 0. ? (P - E)/max(d, 1e-3) : vec2(0.);           // outward normal
  vec2 sun = uMouse/uDpr;
  vec2 toSun = normalize(sun - E + 1e-3);
  float facing = max(dot(nv, toSun), 0.);
  float near = exp(-length(sun - E)/260.);

  // sky: the day drains to deep blue-black, with sunset colour all the way round the horizon
  float y01 = p.y/uRes.y;
  vec3 night = mix(vec3(0.03, 0.045, 0.1), vec3(0.005, 0.008, 0.022), smoothstep(0., 0.75, y01));
  night += vec3(1., 0.5, 0.2)*exp(-y01*8.)*0.28 + vec3(0.55, 0.35, 0.5)*exp(-y01*3.2)*0.05;
  vec3 sky = mix(mix(PAPER, vec3(0.46, 0.55, 0.7), smoothstep(0., 0.5, dark)), night, smoothstep(0.4, 1., dark));
  vec2 sc = floor(P/3.); float sh = hash(sc);
  vec2 sf = fract(P/3.) - 0.5 - (hash2(sc) - 0.5)*0.5;
  sky += vec3(0.8, 0.85, 1.)*step(0.994, sh)*exp(-dot(sf, sf)*28.)*(0.6 + 0.4*sin(uTime*2. + sh*50.))*smoothstep(0.7, 1., dark);
  for (int i = 0; i < 2; i++) {                                 // two planets come out
    vec2 pl = uRes/uDpr*vec2(0.16 + 0.7*float(i), 0.8 - 0.12*float(i));
    sky += vec3(1., 0.95, 0.85)*exp(-length(P - pl)*0.9)*1.2*smoothstep(0.75, 1., dark);
  }

  // the corona: a smooth bright inner glow hugging the edge, then fine rays streaming out from the centre
  vec2 rc = P - LC()/uDpr;
  float ang = atan(rc.y, rc.x);
  float str = 0.6*noise(vec2(ang*26., d*0.006 - uTime*0.02)) + 0.4*noise(vec2(ang*71., d*0.011 + 3.));
  str = pow(str, 2.4)*2.4;
  float I = exp(-d/5.)*0.75 + exp(-d/26.)*0.3*(0.6 + 0.6*str) + exp(-d/95.)*0.14*(0.25 + 1.2*str);
  I *= (0.9 + 0.1*sin(uTime*0.7 + ang*3.))*(0.85 + 0.35*exp(-length(sun - P)/420.)*uHover);   // a touch brighter toward the sun
  vec3 corona = vec3(0.93, 0.96, 1.)*I;
  // chromosphere: a hairline of pink on the sun's side; prominences licking up here and there
  float prom = smoothstep(0.76, 0.9, noise(E*0.035 + 7.))*exp(-d/6.)*(0.35 + 0.65*facing);
  vec3 chrom = vec3(1., 0.24, 0.42)*(exp(-d/2.2)*facing*near*2.2 + prom*0.9);
  // Baily's beads: where the sun is closest, light breaks through the valleys along the edge
  float bead = smoothstep(0.72, 0.8, noise(E*0.23 + floor(uTime*0.5)))*exp(-d/1.3)*near*near*facing;

  // the diamond ring (click): one blinding bead, long flares, and the light flooding back for a moment
  float dia = 0.;
  vec3 ring = vec3(0.);
  for (int i = 0; i < 8; i++) {
    vec4 g = uPing[i];
    if (g.z < 0. || g.z > 2.5) continue;
    float k = exp(-g.z*2.2)*smoothstep(0., 0.05, g.z);
    vec2 dd = (p - g.xy)/uDpr;
    float r = length(dd), sp = 0.;
    for (int j = 0; j < 4; j++) {
      vec2 dir = vec2(cos(float(j)*0.785), sin(float(j)*0.785));
      sp += exp(-abs(dd.x*dir.y - dd.y*dir.x)*1.1)*exp(-abs(dot(dd, dir))/(90.*k + 10.))*(j == 0 ? 1.4 : 0.6);
    }
    ring += vec3(1., 0.98, 0.95)*k*(exp(-r*r/18.)*4. + exp(-r/22.)*0.9 + sp*0.6);
    dia = max(dia, k);
  }

  vec3 col = sky;
  if (d > 0.) col += (corona + chrom + vec3(bead*3.))*glow*(1. - 0.6*dia);
  float moon = smoothstep(0.35, 0.65, A(p));
  vec3 moonC = mix(INK, vec3(0.006, 0.008, 0.014) + (fbm(P*0.02) - 0.5)*0.008, dark);   // black, a whisper of earthshine
  col = mix(col, moonC, moon);
  col += ring*(1. - 0.5*uSafe) + vec3(0.35, 0.42, 0.55)*dia*0.5*(1. - moon)*(1. - 0.8*uSafe);
  col = mix(col, aces(col*1.1), dark);
  col += (hash(P + fract(uTime*7.)*91.) - 0.5)*0.025*dark;
  return col;
}` },

longexposure: { group: "Cosmos", name: "Long Exposure", scene: true, dark: true, idleAfter: 5000,
  desc: "A long-exposure photograph of the night: the sky wheels round your cursor and every star draws a trail, the four stars in the type leaving gold arcs of their own. Meteors and passing planes get caught on the way. Hold to spin time forward, or click to fire the flash and start a new exposure.",
  src: `
vec3 scene(vec2 p){
  vec2 P = p/uDpr;
  float T = uIntro;
  float ex = uS.z;                                    // how far the sky has turned during this exposure (radians)
  vec2 c = uS.xy/uDpr;                                // the celestial pole
  vec2 v = P - c;
  float r = length(v), th = atan(v.y, v.x);
  float y01 = p.y/uRes.y;
  // sky: deep blue up top; green airglow and a little town light down low
  vec3 sky = mix(vec3(0.012, 0.022, 0.05), vec3(0.004, 0.007, 0.02), smoothstep(0.1, 0.9, y01));
  sky += vec3(0.1, 0.25, 0.14)*exp(-y01*5.)*0.22 + vec3(0.9, 0.45, 0.18)*exp(-y01*12.)*0.22;
  sky += vec3(0.1, 0.12, 0.2)*Hl(p)*0.35;             // a faint glow behind the type keeps it readable
  sky *= smoothstep(0., 0.8, T);
  // star trails: rings round the pole, each ring holding a couple of stars that sweep out arcs
  vec3 tr = vec3(0.);
  float ringW = 2.8, ri = floor(r/ringW);
  float full = step(6.2831, ex);
  for (int j = -1; j <= 1; j++) {
    float id = ri + float(j);
    if (id < 0.) continue;
    for (int k = 0; k < 2; k++) {
      vec2 h2 = vec2(id, float(k)*13.7 + 1.);
      if (hash(h2) > 0.45) continue;
      float rs = (id + 0.5 + (hash(h2 + 1.3) - 0.5)*0.7)*ringW;
      float mag = pow(hash(h2 + 3.7), 5.);
      float w = 0.5 + 1.1*mag;
      float dr = r - rs;
      if (abs(dr) > w*3.) continue;
      float a0 = hash(h2 + 2.1)*TAU;
      float along = mod(th - a0, TAU)*rs, len = min(ex, TAU)*rs;
      float body = mix(smoothstep(0., 1., along)*smoothstep(len + 0.8, len - 0.8, along), 1., full);
      float head = (1. - full)*exp(-pow(along - len, 2.)/3.);   // where the star is now
      float flick = 0.75 + 0.25*noise(vec2(along*0.08, id));   // the atmosphere shimmers along the trail
      vec3 tint = mix(vec3(0.72, 0.82, 1.), vec3(1., 0.84, 0.62), hash(h2 + 4.9));
      tr += tint*(0.07 + 1.6*mag)*exp(-dr*dr/(w*w))*(body*flick + head*0.9);
    }
  }
  // the four stars in the type leave the brightest arcs of all, in gold
  vec3 gold = vec3(0.);
  for (int i = 0; i < 4; i++) {
    vec2 s4 = uStar[i].xy/uDpr - c;
    float rs = length(s4), dr = r - rs;
    if (abs(dr) > 10.) continue;
    float along = mod(atan(s4.y, s4.x) - th, TAU)*rs, len = min(ex, TAU)*rs;
    float body = mix(smoothstep(len + 1., len - 1., along), 1., full);
    gold += vec3(1., 0.78, 0.38)*exp(-dr*dr/4.5)*body*(0.9 + 0.5*exp(-along*0.02));
  }
  vec3 col = sky + (tr + gold*1.3)*smoothstep(0.5, 1., T);
  // meteors and planes the exposure caught (uObj pairs: segment, then kind and age)
  for (int i = 0; i < 16; i += 2) {
    if (i >= uObjN) break;
    vec4 sg = uObj[i], mt = uObj[i + 1];
    vec2 a2 = sg.xy/uDpr, ba = sg.zw/uDpr - a2, pa = P - a2;
    float hh = clamp(dot(pa, ba)/dot(ba, ba), 0., 1.);
    float dl = length(pa - ba*hh);
    if (mt.x < 0.5) {
      col += vec3(0.85, 1., 0.9)*exp(-dl*dl/0.5)*pow(hh, 1.5)*step(hh, mt.y/0.35)*1.4;   // a meteor: draws itself in, hottest at the end
    } else {
      float along = hh*length(ba), bl = fract(along/16.);                                 // a plane: strobes, red and white
      float strobe = exp(-pow((bl - 0.2)*10., 2.)) + exp(-pow((bl - 0.6)*10., 2.))*0.8;
      col += (bl < 0.4 ? vec3(1., 0.25, 0.2) : vec3(1.))*exp(-dl*dl/0.6)*strobe*step(along, mt.y*90.)*0.9;
    }
  }
  // the type: a black silhouette rim-lit by the glow on the horizon; its stars burn gold; the flash lights it all
  float a = A(p), st = starM(p);
  vec3 n = nrm(p, 8.);
  vec3 sil = vec3(0.004, 0.005, 0.009) + vec3(0.9, 0.5, 0.25)*pow(clamp(-n.y, 0., 1.), 1.3)*(1. - n.z)*0.35 + vec3(0.3, 0.4, 0.7)*pow(clamp(n.y, 0., 1.), 1.3)*(1. - n.z)*0.12;
  sil = mix(sil, vec3(1., 0.82, 0.45)*(1.3 + 0.4*n.z), smoothstep(0.35, 0.6, st));
  sil = mix(sil, vec3(0.95, 0.94, 0.92)*(0.8 + 0.2*n.z), uS.w);
  col = mix(col, sil, a);
  col += vec3(1., 0.8, 0.45)*smoothstep(0.02, 0.5, st)*(1. - a)*0.35;
  col += vec3(0.6, 0.62, 0.66)*uS.w*0.25;
  col = aces(col*1.2);
  col += (hash(P + fract(uTime*7.)*91.) - 0.5)*0.03;
  return mix(mix(PAPER, INK, a), col, smoothstep(0., 0.4, T));
}` },

  float rimL = dot(nb, Ld);
  card += vec3(0.05)*clamp(rimL - nb.z, -1., 1.)*smoothstep(0.02, 0.4, Hs(p))*(1. - a);

  vec3 fc = foil(n, p, tilt);
  // intro: the blind impression first, then the foil peels on from the left with a glint at the peel line
  vec2 dir = normalize(vec2(1., 0.35));
  float xq = dot(p - uRect.xy, dir)/dot(uRect.zw, dir);
  float pl = (T - 0.8)/1.1;

riso: { group: "Print", name: "Riso", scene: true, status: true, idleAfter: 5000,
  desc: "A two-colour risograph, the young designer's print shop: grainy semi-transparent inks, halftone, and plates that never quite line up. The second plate drifts out of register toward your cursor, with a halftone spot following it. Hold to over-ink the drum, or click to pull the next print in a new pair of inks.",
  helpers: `
float halftone(vec2 P, float tone, float cell, float ang){
  vec2 f = fract(rot(ang)*P/cell) - 0.5;
  float r = sqrt(clamp(tone, 0., 1.))*0.62;
  return smoothstep(r + 0.08, r - 0.08, length(f));
}
// riso ink never goes down perfectly: mottled, speckled, a little streaky from the drum
float inkLay(vec2 P, float cov, float seed, float heavy){
  float mott = fbm(P*0.045 + seed)*0.5 + noise(P*0.3 + seed)*0.5;
  float speck = hash(floor(P*1.25) + seed);
  float band = noise(vec2(P.x*0.012 + seed, 0.5));
  float lay = cov*(0.84 + 0.25*mott - 0.1*band + 0.25*heavy);
  return clamp(lay, 0., 1.)*step(0.035 - heavy*0.03 + (1. - mott)*0.03, speck);
}`,
  src: `
vec3 scene(vec2 p){
  vec2 P = p/uDpr;
  float T = uIntro;
  // the roller: left of it is the new print (uQuad 0-1 and registration uS), right of it the last one (uQuad 4-5, uS3)
  bool fresh = p.x < uS2.x + (noise(vec2(p.y*0.02/uDpr, 3.)) - 0.5)*30.*uDpr;
  vec3 reg = fresh ? uS.xyz : uS3.xyz;
  vec3 ink1 = fresh ? uQuad[0] : uQuad[4], ink2 = fresh ? uQuad[1] : uQuad[5];
  float heavy = uS.w;
  // plate one drifts out of register toward the cursor, and a halftone spot follows it
  vec2 toM = (uMouse - p)/uDpr;
  float pull = exp(-dot(toM, toM)/(2.*220.*220.))*uHover;
  vec2 off = reg.xy + normalize(toM + 1e-3)*5.*pull;
  vec2 c = LC();
  vec2 p1 = c + rot(reg.z)*(p - c) - off*uDpr;
  // plate one: the stars, a halftone echo of the type, the halftone spot
  float st = smoothstep(0.35, 0.6, starM(p1));
  float echo = halftone(P, smoothstep(0.2, 0.9, F(p1 + vec2(6., -6.)*uDpr).g)*0.8, 5., 0.26);
  float spot = halftone(P, exp(-dot(toM, toM)/(2.*170.*170.))*0.95*uHover, 6., 0.26);
  float c1 = max(max(st, echo), spot);
  // plate two: the type, solid
  float c2 = A(p)*(1. - smoothstep(0.35, 0.6, starM(p)));
  // intro: the paper goes through twice, one plate per pass
  float yTop = 1. - p.y/uRes.y;
  c1 *= step(yTop, (T - 0.25)/0.45);
  c2 *= step(yTop, (T - 0.8)/0.45);
  float l1 = inkLay(P, c1, 1.7, heavy), l2 = inkLay(P, c2, 8.3, heavy);
  // natural paper, then the inks laid over it and each other (they multiply, like the real thing)
  vec3 paper = vec3(0.965, 0.95, 0.915) + (noise(P*0.5) - 0.5)*0.02 + (fbm(P*0.03) - 0.5)*0.02;
  vec3 col = paper*mix(vec3(1.), ink1, l1*0.95)*mix(vec3(1.), ink2, l2*0.93);
  // the roller's edge smears a little as it passes
  float edge = exp(-pow((p.x - uS2.x)/(18.*uDpr), 2.))*step(uS2.x, 1e8);
  col = mix(col, col*0.92, edge*0.5);
  return mix(mix(PAPER, INK, A(p)), col, smoothstep(0., 0.25, T));
}` },

sequins: { group: "Fabric", name: "Sequins", scene: true, idle: false, needsFloat: true,

  src: `
vec3 scene(vec2 p){
  vec2 P = p/uDpr;
  float T = uIntro;
  const float SX = 6.2, SY = 5., SR = 3.9;           // pitch and radius (css px): they overlap like scales
  vec3 Lp = vec3(mix(LC() + vec2(-0.2, 0.35)*uRect.zw, uMouse, uHover)/uDpr, 320.);
  vec3 col = vec3(0.02, 0.02, 0.025);                // the netting underneath
  bool hit = false;
  float row = floor(P.y/SY);
  // rows hang from their tops and each row overlaps the one below, so look from the top row down
  for (int j = 1; j >= -1; j--) {
    if (hit) break;
    float rr = row + float(j);
    float off = mod(rr, 2.)*0.5;
    float cc = floor(P.x/SX - off);
    for (int i = 0; i <= 1; i++) {
      if (hit) break;
      float cl = cc + float(i);
      vec2 ctr = vec2((cl + off + 0.5)*SX, (rr + 0.5)*SY);
      float g = texture(uSim, ctr*uDpr/uRes).g;      // this sequin's flip (0 day side … 1 night side)
      float ph = clamp(g, -0.25, 1.25)*3.14159;
      float k = cos(ph);
      vec2 l = P - ctr;
      vec2 q = vec2(l.x, l.y/max(abs(k), 0.06));
      if (length(q) > SR) continue;
      hit = true;
      vec2 qn = q/SR;
      bool night = k < 0.;
      bool letter = A(ctr*uDpr) > 0.5;
      vec3 base = !night ? (letter ? vec3(0.025) : vec3(0.97, 0.965, 0.985)) : (letter ? vec3(1., 0.74, 0.3) : vec3(0.03, 0.028, 0.032));
      // cupped, each sewn at a slightly different angle, tipping over as it flips
      vec2 tl = (hash2(vec2(rr, cl)) - 0.5)*0.5;
      vec3 n = normalize(vec3(qn.x*0.28 + tl.x, qn.y*0.28*sign(k) + tl.y + sin(ph)*1.4, max(abs(k), 0.08)));
      vec3 Ld = normalize(Lp - vec3(P, 0.));
      float dif = max(dot(n, Ld), 0.);
      float sp = pow(max(dot(reflect(-Ld, n), vec3(0., 0., 1.)), 0.), 38.);
      float metal = !night ? (letter ? 0.6 : 0.8) : (letter ? 1. : 0.7);
      vec3 spc = mix(vec3(1.), base, night && letter ? 0.6 : 0.15);
      col = base*((!night && !letter ? 0.72 : 0.35) + (!night && !letter ? 0.4 : 0.75)*dif) + spc*sp*2.2*metal;   // pearl stays bright
      if (!night && !letter) col += (pal(n.x*0.6 + n.y*0.4 + 0.2) - 0.5)*0.07;     // pearl: a faint shift in hue with the angle
      col *= smoothstep(0.3, 0.55, length(vec2(qn.x, qn.y - 0.62)*SR));             // the stitch hole
      col *= mix(0.62, 1., smoothstep(1., 0.8, length(qn)));                          // the rim
      // the row above hangs over this one and shades it
      vec2 up1 = ctr + vec2(-SX*0.5, SY), up2 = ctr + vec2(SX*0.5, SY);
      float du = min(length(P - up1), length(P - up2)) - SR;
      col *= 0.62 + 0.38*smoothstep(0., 2.2, du);

}` },

  return h < 1. ? mix(c0, c1, f) : h < 2. ? mix(c1, c2, f) : h < 3. ? mix(c2, c3, f) : h < 4. ? mix(c3, c4, f) : mix(c4, c0, f);

const ORDER = ["spray", "sequins", "varsity", "dither", "sundial", "goldstar", "riso", "cyanotype",
               "searchlight", "flashbulb", "nursery", "totality", "longexposure", "culture", "edit"];

// =====================================================================
//  GL setup
// =====================================================================
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { antialias: false, premultipliedAlpha: false });
if (!gl) { document.getElementById("fallback").style.display = "grid"; throw new Error("no webgl2"); }

const VERT = `#version 300 es
in vec2 aPos; void main(){ gl_Position = vec4(aPos,0.,1.); }`;

const TRAIL_FRAG = `#version 300 es
precision highp float;
uniform sampler2D uPrev; uniform vec2 uSize, uA, uB, uVel; uniform float uR, uActive;
out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy/uSize;
  vec4 prev = texture(uPrev, uv);
  float i = max(prev.r*0.962 - 0.004, 0.);
  vec2 pa = gl_FragCoord.xy - uA, ba = uB - uA;
  float h = clamp(dot(pa,ba)/max(dot(ba,ba),1e-4), 0., 1.);
  float d = length(pa - ba*h);
  float b = smoothstep(uR, 0., d) * uActive;
  vec2 v = (prev.gb*2.-1.)*0.96;
  v = mix(v, clamp(uVel,-1.,1.), b*0.6);
  o = vec4(max(i, b*0.9), v*0.5+0.5, 1.);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    console.error(log, src.split("\n").map((l, i) => `${i + 1}: ${l}`).join("\n"));
    throw new Error(log);
  }
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, "aPos");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}
const trailProg = program(TRAIL_FRAG);

const fxCache = {};
function fxProgram(key) {
  if (fxCache[key]) return fxCache[key];
  const d = FX[key];
  let defs = "";
  if (d.full) defs += "#define FULL_MASK\n";
  if (d.displaces) defs += "#define DISPLACES\n";
  fxCache[key] = program("#version 300 es\n" + defs + COMMON + (d.helpers || "") + d.src + (d.scene ? SCENE_MAIN : MAIN));
  return fxCache[key];
}

// low-res scenes render into a small target that's then scaled up with hard pixel edges
const blitProg = program(`#version 300 es
precision highp float;
uniform sampler2D uTex; uniform float uCell;
out vec4 o;
void main(){ o = texelFetch(uTex, ivec2(floor(gl_FragCoord.xy/uCell)), 0); }`);
let low = null;
function lowTarget(cell) {
  const w = Math.ceil(canvas.width / cell), h = Math.ceil(canvas.height / cell);
  if (!low || low.w !== w || low.h !== h) {
    if (low) { gl.deleteTexture(low.tex); gl.deleteFramebuffer(low.fb); }
    low = Object.assign(makeTarget(w, h, null), { w, h });
    gl.bindTexture(gl.TEXTURE_2D, low.tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  }
  return low;
}

// ---------- Culture: Gray–Scott reaction–diffusion, a few steps a frame ----------
// state: R = U (substrate), G = V (colony), BA = the colony's strain as a 2-D colour vector
const RD_FRAG = `#version 300 es
precision highp float;
uniform sampler2D uState, uField;
uniform vec2 uSize, uCellPx, uMouse;
uniform vec4 uRect;
uniform float uHover, uEsc, uTime, uDpr;
uniform vec4 uSeed[8];   // xy (px), radius (px), strain hue
uniform int uSeedN;
uniform vec4 uRing;      // a click's ring: centre (px), radius (px), strain hue — radius <= 0 means none
out vec4 o;
float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float ink(vec2 px){
  vec2 uv = (px - uRect.xy)/uRect.zw; uv.y = 1. - uv.y;
  if (uv.x < 0. || uv.y < 0. || uv.x > 1. || uv.y > 1.) return 0.;
  return texture(uField, uv).r;
}
vec2 tagOf(float h){ return vec2(cos(h*6.28318), sin(h*6.28318)); }
void main(){
  vec2 t = 1./uSize, uv = gl_FragCoord.xy*t, px = gl_FragCoord.xy*uCellPx;
  vec4 s = texture(uState, uv);
  vec4 e = texture(uState, uv + vec2(t.x, 0.)), w = texture(uState, uv - vec2(t.x, 0.));
  vec4 n = texture(uState, uv + vec2(0., t.y)), so = texture(uState, uv - vec2(0., t.y));
  vec4 ne = texture(uState, uv + t), sw = texture(uState, uv - t);
  vec4 nw = texture(uState, uv + vec2(-t.x, t.y)), se = texture(uState, uv + vec2(t.x, -t.y));
  vec2 lap = (e.rg + w.rg + n.rg + so.rg)*0.2 + (ne.rg + sw.rg + nw.rg + se.rg)*0.05 - s.rg;
  float U = s.r, V = s.g;
  vec2 tag = s.ba;

  // what thrives where: coral, labyrinth and holes drift slowly across the letters
  vec2 q = px/uDpr;
  float n1 = noise(q*0.006 + vec2(uTime*0.015, 0.));

async function buildField() {
  const svgText = await (await fetch("vector.svg")).text();
  edBuild(svgText);

  vectorImg = img;
  img.src = "vector.svg";
  await img.decode();
  // rasterise from the parsed paths rather than the SVG image: the file draws each glyph as a fill plus a
  // masked outside stroke, which leaves a hairline seam inside every letter; fill + full stroke is the same shape
  const raw = canvas2d(FW, FH), rctx = raw.getContext("2d");
  rctx.setTransform(RW / SVG_W, 0, 0, RH / SVG_H, PAD, PAD);
  Object.assign(rctx, { fillStyle: "#000", strokeStyle: "#000", lineWidth: 16.3464, lineJoin: "miter", miterLimit: 4 });
  ED.paths.forEach(P => { const p2 = new Path2D(P.d); rctx.fill(p2); if (!P.star) rctx.stroke(p2); });
  rctx.setTransform(1, 0, 0, 1, 0, 0);
  const rd = rctx.getImageData(0, 0, FW, FH).data;

  const inkC = canvas2d(FW, FH), ictx = inkC.getContext("2d");
  const inkData = ictx.createImageData(FW, FH), id = inkData.data;

    id[i + 3] = rd[i + 3] * (1 - lum);

  const lg = blurred(inkC, 42).getContext("2d").getImageData(0, 0, FW, FH).data;

  sctx.setTransform(RW / SVG_W, 0, 0, RH / SVG_H, PAD, PAD);
  ED.paths.filter(P => P.star).forEach(P => sctx.fill(new Path2D(P.d)));

// click = next colour scheme; press + drag = move the primary colour (hue sideways, saturation up/down)
const drag = { active: false, moved: false, x: 0, y: 0, hue: 0, sat: 1 };
const hud = {

// ---------- Bayer Dither interaction styles ----------

    const band = L.querySelector(".ring-band"), satEl = L.querySelector(".ring-sat"), spoke = L.querySelector("line"),

      label: "Swarm",

        P.forEach(p => { const a = Math.random() * 6.28, v = 120 + Math.random() * 260;
          Object.assign(p, { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: 1, lvl: levelFor(p.i) }); });
